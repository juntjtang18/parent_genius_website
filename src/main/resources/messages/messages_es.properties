faq.a.privacy.collect.li2=No hay correo electrónico verificado obligatorio
faq.a.privacy.collect.li3=No se requieren datos identificables para niños
faq.a.privacy.collect.li4=Recopilación mínima de datos por diseño.
faq.a.privacy.collect.p2=GeniusParentingAI está diseñado para apoyar a las familias, no para recopilar datos.
faq.q.privacy.anon=¿Mi información es anónima?
faq.a.privacy.anon.p1=Sí.
faq.a.privacy.anon.p2=La plataforma es anónima por defecto. Puedes explorar libremente sin revelar tu identidad.
faq.q.privacy.share=¿Vendes o compartes datos de usuarios?
