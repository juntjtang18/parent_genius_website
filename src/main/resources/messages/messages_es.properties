pillars.title=El marco infantil integral GeniusParentingAI
pillars.hero.title=GeniusParentingAI Whole Child Framework™
pillars.hero.sub=Entendiendo a los niños a través de principios dinámicos, fortaleciendo todas las vidas.
pillars.intro.title=Todo padre quiere lo mejor para su hijo.
pillars.intro.p1=Sin embargo, la crianza de los hijos puede resultar abrumadora cuando uno se enfrenta a comportamientos desafiantes, altibajos emocionales, preocupaciones escolares, dificultades sociales o los rápidos cambios que trae la tecnología actual. Es natural buscar respuestas rápidas, pero los niños rara vez son tan simples.
pillars.intro.p2=La mayoría de los recursos para padres se centran en resolver un problema a la vez: rabietas, ansiedad, tareas, tiempo frente a la pantalla, TDAH, amistades o regulación emocional.
pillars.intro.p3=Pero los niños no crecen en categorías aisladas. Las emociones de un niño afectan el aprendizaje. El procesamiento sensorial influye en el comportamiento. El funcionamiento ejecutivo impacta las amistades. La comunicación da forma a la confianza. Las rutinas familiares afectan el bienestar emocional. Cada parte del desarrollo está conectada.
pillars.intro.p4=Cuando nos centramos en un solo desafío, podemos pasar por alto los factores subyacentes que lo impulsan. Es por eso que GeniusParentingAI está diseñado de manera diferente.
pillars.intro.mission_label=Nuestra misión es simple:
pillars.intro.mission=Comprender a los niños. Empoderar a los padres. Fortalecimiento de las Familias.
pillars.intro.mission_p1=Creemos que cuando los padres realmente comprenden cómo encaja el desarrollo de sus hijos, pueden tomar decisiones con más confianza, responder con mayor empatía y construir familias más fuertes y conectadas.
pillars.intro.mission_p2=En lugar de tratar la crianza de los hijos como una colección de temas separados, organizamos el aprendizaje en torno a seis pilares de aprendizaje conectados que ayudan a los padres a comprender al niño en su totalidad. Cada pilar ofrece una perspectiva diferente y juntos crean una imagen completa del crecimiento, las fortalezas y los desafíos de su hijo.
pillars.intro.puzzle=Piense en el desarrollo de su hijo como un rompecabezas. Una pieza puede explicar parte de lo que ves, pero ninguna cuenta por sí sola la historia completa. A medida que se unen más piezas, los patrones se vuelven más claros, las soluciones se vuelven más efectivas y la crianza de los hijos se vuelve más segura.
pillars.intro.together=Nuestros pilares de aprendizaje están diseñados para trabajar juntos para que usted pueda:
pillars.check.1=Comprenda por qué puede estar ocurriendo un comportamiento o desafío.
pillars.check.2=Reconocer cómo las diferentes áreas del desarrollo se influyen entre sí.
pillars.check.3=Aprenda estrategias prácticas basadas en evidencia que se adapten a su hijo y su familia.
pillars.check.4=Descubra temas relacionados que pueden proporcionar información y apoyo adicionales.
pillars.intro.close_title=No es necesario convertirse en un experto en desarrollo infantil.
pillars.intro.close=Lo guiaremos a través de las conexiones, le recomendaremos los siguientes pasos de aprendizaje y lo ayudaremos a desarrollar confianza paso a paso. El objetivo no es simplemente resolver el problema actual, sino ayudar a su hijo a prosperar emocional, social, académicamente y en la vida cotidiana.
pillars.grid.title=Nuestros seis pilares de aprendizaje
pillars.grid.sub=Juntos, nuestros seis pilares de aprendizaje crean un ecosistema de crianza conectado que apoya al niño en su totalidad en lugar de desafíos aislados.
pillars.grid.cta=Ver cursos
pillars.promise.title=Nuestra promesa
pillars.promise.sub=No nos limitaremos a decirle lo que su hijo puede estar experimentando. Te ayudaremos a entender
pillars.promise.1=Por qué puede estar sucediendo.
pillars.promise.2=Cómo se conectan las diferentes áreas de desarrollo.
pillars.promise.3=Qué estrategias prácticas puedes utilizar hoy.
pillars.promise.4=Dónde ir a continuación para obtener un aprendizaje más profundo y apoyo continuo.
pillars.promise.text=Cada lección, cada recomendación de IA, cada recurso descargable y cada pilar de aprendizaje está diseñado con un propósito: ayudarlo a comprender mejor a su hijo y respaldar su viaje único con confianza.
pillars.promise.text2=Porque cuando los padres comprenden al niño en su totalidad, no solo el desafío, toman mejores decisiones, construyen relaciones más sólidas y crean cambios positivos duraderos para sus familias.
pillars.philosophy.title=Nuestra Filosofía
pillars.philosophy.mission=Comprender a los niños. Empoderar a los padres. Fortalecimiento de las Familias.
pillars.philosophy.sub=Cada niño es único. Cada desafío está conectado. Toda familia puede aprender.
