faq.title=Preguntas frecuentes - GeniusParentingAI
faq.title=Preguntas frecuentes
faq.section.about=Acerca de GeniusParentingAI
faq.q.about.created=¿Quién creó GeniusParentingAI?
faq.a.about.created.p1=GeniusParentingAI fue fundada por un educador y profesional del software con experiencia en educación, desarrollo infantil, tecnología e inteligencia artificial.
faq.a.about.created.p2=Se construyó sobre una simple creencia:
faq.a.about.created.belief=Los padres merecen apoyo confiable, práctico y sin prejuicios mientras enfrentan los desafíos cotidianos de criar a sus hijos, especialmente en comunidades diversas y multiculturales.
faq.a.about.created.p3=En lugar de agregar más información sobre crianza a Internet, GeniusParentingAI reúne experiencia educativa, inteligencia artificial responsable y orientación práctica para ayudar a las familias a tomar decisiones seguras, paso a paso.
faq.section.for=¿Para quién es?
faq.q.for.who=¿A quién está dirigido GeniusParentingAI?
faq.a.for.who.p1=GeniusParentingAI está diseñado para:
faq.a.for.who.li1=Padres y cuidadores
faq.a.for.who.li3=Familias inmigrantes y multiculturales
faq.a.for.who.li4=Educadores y practicantes
faq.a.for.who.li5=Instituciones enfocadas al bienestar familiar
faq.a.for.who.p2=No es necesario ser un “padre perfecto” para pertenecer aquí.
faq.a.for.who.p3=Si le interesa criar niños reflexivos y resilientes, está en el lugar correcto.
faq.q.for.diff=¿Qué hace que GeniusParentingAI sea diferente?
faq.a.for.diff.p1=Muchos sitios web para padres ofrecen información. GeniusParentingAI está diseñado para ayudar a los padres a aprender, pensar y tomar decisiones seguras, no simplemente buscar respuestas.
faq.a.for.diff.p2=Nuestro enfoque se basa en cinco principios:
faq.a.for.diff.li1=Basado en la educación: desarrollado con experiencia educativa e informado por investigaciones sobre el aprendizaje y el desarrollo infantil basadas en evidencia.
faq.a.for.diff.li2=IA que guía, no reemplaza: la IA responsable ayuda a los padres a descubrir aprendizajes relevantes, estrategias prácticas y recursos confiables, al tiempo que fomenta una toma de decisiones reflexiva.
faq.a.for.diff.li3=Privacidad por diseño: los padres pueden explorar y aprender de forma anónima. Recopilamos solo la información mínima necesaria y nunca construimos la plataforma en torno a publicidad o venta de datos personales.
faq.a.for.diff.li4=Práctico para la vida familiar cotidiana: nuestros cursos, ejemplos y actividades están diseñados para adaptarse de forma natural a situaciones reales de crianza, con orientación adaptada a las diferentes edades y etapas de desarrollo.
faq.a.for.diff.li5=Construido con respeto por cada familia: reconocemos que cada familia es única. Nuestro objetivo es brindar apoyo inclusivo y sin prejuicios que respete las diferentes culturas, valores y trayectorias de crianza.
faq.a.for.diff.p3=En lugar de decirles a los padres qué hacer, GeniusParentingAI ayuda a las familias a desarrollar conocimientos, confianza y habilidades prácticas: una conversación, un curso y un pequeño paso a la vez.
faq.section.app=¿Qué puedo hacer en la aplicación?
faq.q.app.do=¿Qué puedo hacer en GeniusParentingAI?
faq.a.app.do.p1=Dentro de GeniusParentingAI, puedes acceder a:
faq.a.app.do.li1=Orientación para padres específica por edad
faq.a.app.do.li2=Seguimiento del crecimiento y desarrollo infantil.
faq.a.app.do.li3=Perspectivas para padres bilingües y biculturales
faq.a.app.do.li4=Reflexiones sobre bienestar mental para padres
faq.a.app.do.li5=Actividades y rutinas por grupo de edad
faq.a.app.do.li6=Círculos comunitarios por ciudad, origen o tema
faq.a.app.do.li7=Herramientas de reflexión respaldadas por IA para situaciones de crianza de los hijos en la vida real
faq.a.app.do.p2=No es sólo un consejo: es un espacio para pensar, crecer y conectarse.
faq.section.community=¿Puedo conectarme con otros padres?
faq.q.community.connect=¿Puedo conectarme con otros padres?
faq.a.community.connect.p1=Sí, la comunidad es fundamental para GeniusParentingAI.
faq.a.community.connect.p2=Puedes unirte a círculos según:
faq.a.community.connect.li1=La edad de su hijo
faq.a.community.connect.li2=Tu origen cultural
faq.a.community.connect.li3=tu ciudad
