faq.title=자주 묻는 질문 - GeniusParentingAI
faq.title=자주 묻는 질문
faq.section.about=Genius육아AI 소개
faq.q.about.created=GeniusParentingAI를 만든 사람은 누구인가요?
faq.a.about.created.p1=GeniusParentingAI는 교육, 아동 발달, 기술 및 AI 분야의 전문 지식을 갖춘 교육자이자 소프트웨어 전문가가 설립했습니다.
faq.a.about.created.p2=이는 다음과 같은 단순한 신념을 바탕으로 구축되었습니다.
faq.a.about.created.belief=부모는 특히 다양하고 다문화적인 지역 사회에서 자녀를 양육하는 일상적인 어려움을 헤쳐 나갈 때 신뢰할 수 있고 실용적이며 판단 없는 지원을 받을 자격이 있습니다.
faq.a.about.created.p3=GeniusParentingAI는 인터넷에 더 많은 육아 정보를 추가하는 대신 교육 전문 지식, 책임감 있는 AI, 실용적인 지침을 결합하여 가족이 한 번에 한 단계씩 자신감 있는 결정을 내릴 수 있도록 돕습니다.
faq.section.for=누구를 위한 것인가?
faq.q.for.who=GeniusParentingAI는 누구를 위한 것인가요?
faq.a.for.who.p1=GeniusParentingAI는 다음을 위해 설계되었습니다:
faq.a.for.who.li1=부모와 보호자
faq.a.for.who.li3=이민자 및 다문화가족
faq.a.for.who.li4=교육자 및 실무자
faq.a.for.who.li5=가족 복지에 중점을 둔 기관
faq.a.for.who.p2=여기에 속하기 위해 “완벽한 부모”가 될 필요는 없습니다.
faq.a.for.who.p3=사려 깊고 회복력이 뛰어난 자녀를 키우는 데 관심이 있다면 올바른 위치에 오셨습니다.
faq.q.for.diff=GeniusParentingAI가 다른 점은 무엇인가요?
faq.a.for.diff.p1=많은 육아 웹사이트에서 정보를 제공합니다. GeniusParentingAI는 단순히 답을 찾는 것이 아니라 부모가 배우고, 생각하고, 자신감 있는 결정을 내릴 수 있도록 돕기 위해 설계되었습니다.
faq.a.for.diff.p2=우리의 접근 방식은 다음과 같은 5가지 원칙을 기반으로 합니다.
faq.a.for.diff.li1=교육적 기반 - 교육적 전문성을 바탕으로 개발되었으며 증거 기반 아동 발달 및 학습 연구를 통해 정보를 얻었습니다.
faq.a.for.diff.li2=대체하지 않고 안내하는 AI - 책임 있는 AI는 부모가 사려 깊은 의사 결정을 장려하면서 관련 학습, 실용적인 전략 및 신뢰할 수 있는 리소스를 찾을 수 있도록 도와줍니다.
faq.a.for.diff.li3=개인 정보 보호 설계 – 부모는 익명으로 탐색하고 학습할 수 있습니다. 우리는 필요한 최소한의 정보만 수집하며 개인 데이터 광고나 판매를 중심으로 플랫폼을 구축하지 않습니다.
faq.a.for.diff.li4=일상적인 가족 생활에 실용적 – 당사의 코스, 예시 및 활동은 다양한 연령과 발달 단계에 맞춰진 지침과 함께 실제 양육 상황에 자연스럽게 맞도록 설계되었습니다.
faq.a.for.diff.li5=모든 가족에 대한 존중을 바탕으로 구축 – 우리는 모든 가족이 독특하다는 것을 인식합니다. 우리의 목표는 다양한 문화, 가치 및 육아 여정을 존중하는 포괄적이고 판단 없는 지원을 제공하는 것입니다.
faq.a.for.diff.p3=GeniusParentingAI는 부모에게 무엇을 해야 할지 지시하는 대신 가족이 한 번에 하나의 대화, 하나의 코스, 작은 단계 하나를 통해 지식, 자신감 및 실용적인 기술을 쌓도록 돕습니다.
faq.section.app=앱에서 무엇을 할 수 있나요?
faq.q.app.do=GeniusParentingAI에서는 무엇을 할 수 있나요?
faq.a.app.do.p1=GeniusParentingAI 내에서 다음 항목에 액세스할 수 있습니다.
faq.a.app.do.li1=연령별 양육 지침
faq.a.app.do.li2=아동 성장 및 발달 추적
faq.a.app.do.li3=이중 언어 및 이중 문화 육아 통찰력
faq.a.app.do.li4=부모를 위한 정신 건강 반영
faq.a.app.do.li5=연령별 활동 및 일과
faq.a.app.do.li6=도시, 배경, 주제별 커뮤니티 서클
faq.a.app.do.li7=실제 육아 상황을 위한 AI 지원 반영 도구
faq.a.app.do.p2=단순한 조언이 아니라 생각하고, 성장하고, 연결할 수 있는 공간입니다.
