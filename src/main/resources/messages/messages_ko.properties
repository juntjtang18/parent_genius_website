pillars.title=GeniusParentingAI 전체 아동 프레임워크
pillars.hero.title=GeniusParentingAI 전체 아동 프레임워크™
pillars.hero.sub=어린이 이해. 부모에게 힘을 실어줍니다. 가족을 강화합니다.
pillars.intro.title=모든 부모는 자녀가 최선을 다하길 원합니다.
pillars.intro.p1=그러나 도전적인 행동, 감정적 기복, 학교 문제, 사회적 어려움 또는 오늘날의 기술로 인한 급격한 변화에 직면할 때 양육은 부담감을 느낄 수 있습니다. 빠른 답을 찾는 것은 자연스러운 일입니다. 하지만 아이들은 그렇게 단순하지 않습니다.
pillars.intro.p2=대부분의 양육 자료는 짜증, 불안, 숙제, 화면 시간, ADHD, 우정, 감정 조절 등 한 번에 한 가지 문제를 해결하는 데 중점을 둡니다.
pillars.intro.p3=그러나 아이들은 고립된 범주에서 성장하지 않습니다. 아이의 감정은 학습에 영향을 미칩니다. 감각 처리는 행동에 영향을 미칩니다. 실행 기능은 우정에 영향을 미칩니다. 의사소통은 자신감을 형성합니다. 가족의 일상은 정서적 안녕에 영향을 미칩니다. 개발의 모든 부분은 연결되어 있습니다.
pillars.intro.p4=우리가 한 가지 과제에만 초점을 맞추면 이를 추진하는 근본적인 요인을 간과할 수 있습니다. 이것이 바로 GeniusParentingAI가 다르게 구축된 이유입니다.
pillars.intro.mission_label=우리의 임무는 간단합니다:
pillars.intro.mission=어린이 이해. 부모에게 힘을 실어줍니다. 가족을 강화합니다.
pillars.intro.mission_p1=우리는 부모가 자녀의 발달이 어떻게 서로 조화를 이루는지 진정으로 이해할 때, 더 자신감 있는 결정을 내리고 더 큰 공감으로 대응하며 더 강하고 더 연결된 가족을 만들 수 있다고 믿습니다.
pillars.intro.mission_p2=육아를 별도의 주제로 다루는 대신, 부모가 아이 전체를 이해하는 데 도움이 되는 6개의 연결된 학습 기둥을 중심으로 학습을 구성합니다. 각 기둥은 서로 다른 관점을 제공하며 함께 자녀의 성장, 강점 및 과제에 대한 완전한 그림을 만듭니다.
pillars.intro.puzzle=자녀의 발달을 하나의 퍼즐로 생각하십시오. 한 조각이 당신이 보는 것의 일부를 설명할 수는 있지만, 어떤 한 조각도 전체 이야기를 말해주지는 않습니다. 더 많은 조각이 모일수록 패턴은 더욱 명확해지고 솔루션은 더욱 효과적이 되며 육아에 대한 자신감이 커집니다.
pillars.intro.together=우리의 학습 기반은 함께 작동하여 다음을 수행할 수 있도록 설계되었습니다.
pillars.check.1=행동이나 문제가 발생하는 이유를 이해하십시오.
pillars.check.2=다양한 개발 영역이 서로 어떻게 영향을 미치는지 인식합니다.
pillars.check.3=귀하의 자녀와 가족에게 적합한 실용적이고 증거에 기반한 전략을 배우십시오.
pillars.check.4=추가적인 통찰력과 지원을 제공할 수 있는 관련 주제를 알아보세요.
pillars.intro.close_title=아동 발달 전문가가 될 필요는 없습니다.
pillars.intro.close=연결 과정을 안내하고, 다음 학습 단계를 권장하며, 한 번에 한 단계씩 자신감을 쌓을 수 있도록 도와드립니다. 목표는 단순히 오늘날의 문제를 해결하는 것이 아니라 자녀가 정서적, 사회적, 학문적, 일상 생활에서 성장하도록 돕는 것입니다.
pillars.grid.title=여섯 가지 학습 원칙
pillars.grid.sub=우리의 6가지 학습 원칙은 함께 고립된 문제가 아닌 전체 자녀를 지원하는 연결된 양육 생태계를 만듭니다.
pillars.grid.cta=강좌 보기
pillars.promise.title=우리의 약속
pillars.promise.sub=우리는 귀하의 자녀가 겪고 있는 상황을 단순히 말해주지 않습니다. 이해를 도와드리겠습니다
pillars.promise.1=왜 그런 일이 일어날 수 있습니까?
pillars.promise.2=다양한 발달 영역이 어떻게 연결되어 있는지.
pillars.promise.3=오늘 사용할 수 있는 실용적인 전략은 무엇입니까?
pillars.promise.4=더 깊은 학습과 지속적인 지원을 위해 다음 단계로 가야 할 곳입니다.
pillars.promise.text=모든 수업, 모든 AI 권장 사항, 다운로드 가능한 모든 리소스 및 모든 학습 기둥은 하나의 목적으로 설계되었습니다. 즉, 자녀를 더 잘 이해하고 자녀의 독특한 여정을 자신있게 지원하는 것입니다.
pillars.promise.text2=부모가 단지 문제가 아니라 아이 전체를 이해할 때 더 나은 결정을 내리고, 더 강한 관계를 구축하고, 가족을 위해 지속적이고 긍정적인 변화를 만들어내기 때문입니다.
pillars.philosophy.title=우리의 철학
pillars.philosophy.mission=어린이 이해. 부모에게 힘을 실어줍니다. 가족을 강화합니다.
pillars.philosophy.sub=모든 어린이는 독특합니다. 모든 도전은 연결되어 있습니다. 모든 가족은 배울 수 있습니다.
