about-hero-title=가족들이 우리를 신뢰하는 이유.
about-hero-text=모든 부모의 여정은 "나는 준비됐나요? 내가 이 일을 제대로 하고 있나요?"라는 질문으로 시작됩니다. 육아에는 매뉴얼이 없습니다. 그리고 그 느낌은 보편적입니다. 실제로 자신의 삶에 맞는 지원, 확신, 지도가 필요합니다. 혼자 알아낼 필요는 없습니다.
about-care-title=우리의 핵심 신념
about-believe-cap5=GeniusParentingAI는 부모가 강력한 기초 지식을 쌓고 일반적인 함정을 피하며 자녀의 장기적인 웰빙을 지원하는 사려 깊고 정보에 입각한 결정을 내릴 수 있도록 돕기 위해 존재합니다.
about-believe-cap6=교육 전문 지식, 기술 혁신 및 실제 육아 통찰력을 결합함으로써 우리 플랫폼은 가족, 교육자, 실무자 및 기관에 혜택을 주는 동시에 더 넓은 아동 및 가족 복지 커뮤니티 전반에 걸쳐 연구, 커뮤니케이션 및 협력을 지원하는 것을 목표로 합니다.
about-caption-50=우리의 비전
about-caption-51=부모에게 지식, 도구, 지원을 제공하려면 성장을 촉진하고 회복력을 키우며 다음 세대가 자신감, 동정심, 호기심을 가지고 성장할 수 있도록 영감을 주는 사랑스럽고 지원적인 가족을 만드는 데 필요한 것입니다.
about-caption-52=우리의 사명
about-caption-53=우리의 임무는 부모에게 실행 가능한 통찰력, 전문가 조언, 혁신적인 리소스를 제공하여 아이들이 인생에서 성공하는 데 필요한 기술을 성장하고 성장하고 개발할 수 있는 양육 환경을 조성하도록 돕는 것입니다.
about-team-title=우리 팀
about-team-cap1=데이비드 보그트 박사
about-team-cap2=자문위원
about-team-cap3=브리티시 컬럼비아 대학교 교수
about-team-cap4=David Vogt 박사는 브리티시 컬럼비아 대학의 교수이자 뛰어난 혁신 리더입니다.
about-team-cap5=과학, 리더십 및 공교육의 교차점에서 수십 년의 경험을 보유한 Vogt 박사는 신흥 기술의 사려 깊은 통합으로 널리 알려져 있습니다.
about-team-cap6=슈궈
about-team-cap7=GeniusParentingAI 창립자
about-team-cap8=브리티시 컬럼비아 대학교 교육학 석사
about-team-cap9=Shu Guo는 브리티시 컬럼비아 대학교에서 교육학 석사 학위를 취득했으며 어린이 및 가족과 함께 일한 광범위한 경험을 보유한 교육자입니다.
about-team-cap10=GeniusParentingAI는 완벽한 육아 아이디어에서 탄생한 것이 아니라, 실제적이고 생생한 경험을 바탕으로 탄생했습니다.
about-team-cap11=이러한 도전을 통해 그녀는 실패는 좋은 양육의 반대가 아니라 종종 의미 있는 학습이 시작되는 곳이라는 핵심 신념을 발전시켰습니다.
about-team-cap12=이 철학은 GeniusParentingAI의 기초를 형성합니다. 즉, 실제 문제에 직면한 실제 가족을 위한 자비로운 지원, 실용적인 지침 및 증거에 기반한 통찰력입니다.
about-team-cap13=제임스 탕
about-team-cap14=풀스택 아키텍트 및 AI 제품 빌더
about-team-cap15=Fairleigh Dickinson University CS 석사
about-team-cap16=James Tang은 복잡한 아이디어를 확장 가능한 고성능 소프트웨어 시스템으로 변환하는 20년 이상의 경험을 보유한 풀 스택 설계자이자 AI 중심 제품 빌더입니다.
about-team-cap17=그는 글로벌 엔터프라이즈 제품의 엔지니어링 팀을 이끌었고 개념부터 출시까지 AI 기반 모바일 및 웹 애플리케이션을 구축했습니다.
about-team-cap18=James는 뛰어난 소프트웨어가 강력한 기본, 깔끔한 아키텍처 및 규율 있는 실행을 기반으로 구축된다고 믿습니다.
about-trust-title=가족들이 우리를 신뢰하는 이유
about-trust-1-title=Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.
about-trust-1-text=우리의 프레임워크는 UBC 교육 리더십, 자문위원회 감독 및 EdTech 협력자들에 의해 개발되고 안내되므로 지침은 실제 교육 실습에 기반을 두고 있습니다.
about-trust-2-title=기술신뢰
about-trust-2-text=AI는 무작위 포럼이 아닌 전문가가 심사한 교육 프레임워크에서 훈련을 받았는데, 이는 환각이 적고 책임감을 유지하는 지원이 적다는 것을 의미합니다.
about-trust-3-title=실질적인 신뢰
about-trust-3-text=조언은 실제 육아 문제와 일상적인 가족 생활에 따라 형성되므로 이론상으로만 그런 것이 아니라 새벽 3시에 유용합니다.
