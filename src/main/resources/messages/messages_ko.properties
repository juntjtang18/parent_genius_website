seg-community.values.lead=우리는 함께 부모들이 한 번에 하나의 대화를 통해 배우고, 연결하고, 성장할 수 있는 커뮤니티를 구축하고 있습니다.
seg-community.values.title=연결하다. 배우다. 지원하다.
seg-community.values.body=같은 생각을 가진 부모들이 지식이 풍부하고 필요한 지침을 쉽게 찾을 수 있도록 협업할 수 있는 공간입니다.
seg-community.cta.title=아이를 키우려면 마을이 필요하기 때문입니다. 그리고 우리는 여러분을 위해 마을을 짓고 있습니다.
