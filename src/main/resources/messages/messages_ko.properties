home.why.title_en=왜 천재 육아 AI인가요?
home.why.intro=우리의 지침은 일반적인 AI 추측이 아닌 입증된 교육 프레임워크를 기반으로 구축되었습니다. 이는 환각이 줄어들고 신뢰할 수 있는 지원을 의미합니다.
home.why.card1.title_en=교육 전문성을 바탕으로 구축
home.why.card1.text_en=브리티시 컬럼비아 대학교와 연계된 전문가들과 함께 설계되었으므로 모든 권장 사항은 실제 교육 실습에 기초를 두고 있습니다.
home.why.learn_en=자세히 알아보기 →
home.why.card2.title_en=책임감 있는 AI
home.why.card2.text_en=무작위 포럼이 아닌 전문가가 검증한 프레임워크에 대한 교육을 받았으므로 즉석에서 답변하는 것이 아니라 교육적인 답변을 제공합니다.
home.why.learn_en=자세히 알아보기 →
home.why.card3.title_en=은둔
home.why.card3.text_en=기본적으로 익명입니다. 가족을 추적하지 않으며 데이터를 판매하지 않습니다.
home.why.learn_en=자세히 알아보기 →
