seg-community.hero.title=우리 커뮤니티에 오신 것을 환영합니다
seg-community.hero.body=우리는 부모들이 질문하고, 경험을 공유하고, 서로 배울 수 있는 안전하고 지원적인 장소를 위해 커뮤니티를 만들었습니다.
seg-community.ai.title=적절한 지원을 신속하게 찾을 수 있도록 모든 토론은 AI를 사용하여 6가지 학습 기반으로 자동 구성됩니다.
seg-community.ai.body=즉, 끝없이 스크롤하지 않고도 더 쉽게 탐색하고, 중요한 주제를 검색하고, 필요한 육아 조언을 찾을 수 있습니다.
seg-community.ai.also=다음을 수행할 수도 있습니다.
seg-community.ai.card=존중하고 판단하지 않는 환경에서 대화에 참여하고, 질문하고, 다른 부모를 지원하십시오.
seg-community.ai.card=존중하고 판단하지 않는 환경에서 대화에 참여하고, 질문하고, 다른 부모를 지원하십시오.
