seg-emotion-top-caption-101=왜 중요한가
seg-emotion-top-caption-102=캐나다 소아과 학회의 연구에 따르면, 강한 정서적 지원을 받으며 성장한 아이들은 더 자신감 있고, 불안이 적으며, 문제 해결 능력이 뛰어납니다. 높은 정서 지능(EQ)을 가진 부모는 학교뿐만 아니라 우정과 미래의 직장에서도 잘 성장하는 아이들을 기릅니다.
