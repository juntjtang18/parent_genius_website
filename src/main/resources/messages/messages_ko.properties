joinus.title1=가입하세요!
joinus.description=Parent Genius AI에서 우리는 육아 지원의 미래를 구축하고 있습니다. 혁신, 투명성 및 협업을 중요시합니다. 우리 팀에 합류하여 전 세계 가족을 위한 더 밝은 미래를 형성하는 데 도움을 주세요!
joinus.uiux.title=UI/UX 디자이너
joinus.uiux.description1=우리는 플랫폼을 위한 직관적이고 시각적으로 매력적인 사용자 경험을 설계할 수 있는 창의적인 UI/UX 디자이너를 찾고 있습니다.
joinus.uiux.description2=책임:
joinus.uiux.responsibility1=웹 및 모바일 애플리케이션을 위한 사용자 친화적인 인터페이스를 설계하고 프로토타입합니다.
joinus.uiux.responsibility2=개발자 및 이해관계자와 협력하여 원활한 사용자 경험을 보장합니다.
