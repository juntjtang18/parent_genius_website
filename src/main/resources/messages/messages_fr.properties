about-hero-title=Pourquoi les familles nous font confiance.
about-hero-text=Le parcours de chaque parent commence par une question : « Suis-je prêt ? Est-ce que je fais les choses correctement ? Être parent ne s'accompagne pas d'un manuel. Et ce sentiment est universel : le besoin de soutien, de réconfort et de conseils qui correspondent réellement à votre vie. Vous n'êtes pas obligé de le découvrir seul.
about-care-title=Notre conviction fondamentale
about-believe-cap5=GeniusParentingAI existe pour aider les parents à acquérir de solides connaissances de base, à éviter les pièges courants et à prendre des décisions réfléchies et éclairées qui soutiennent le bien-être à long terme de leurs enfants.
about-believe-cap6=En combinant l'expertise pédagogique, l'innovation technologique et les connaissances parentales réelles, notre plateforme vise à bénéficier aux familles, aux éducateurs, aux praticiens et aux institutions, tout en soutenant également la recherche, la communication et la collaboration au sein de la communauté plus large du bien-être des enfants et des familles.
about-caption-50=Notre vision
about-caption-51=Donner aux parents les connaissances, les outils et le soutien dont ils ont besoin pour créer des familles aimantes et solidaires qui favorisent la croissance, favorisent la résilience et inspirent la prochaine génération à s'épanouir avec confiance, compassion et curiosité.
about-caption-52=Notre mission
about-caption-53=Notre mission est de fournir aux parents des informations pratiques, des conseils d'experts et des ressources innovantes, les aidant à créer des environnements stimulants où les enfants peuvent grandir, s'épanouir et développer les compétences dont ils ont besoin pour réussir dans la vie.
about-team-title=Notre équipe
about-team-cap1=Dr David Vogt
about-team-cap2=Membre du conseil consultatif
about-team-cap3=Professeur, Université de la Colombie-Britannique
about-team-cap4=Le Dr David Vogt est professeur à l'Université de la Colombie-Britannique et un leader accompli en matière d'innovation.
about-team-cap5=Fort de plusieurs décennies d'expérience à l'intersection de la science, du leadership et de l'éducation publique, le Dr Vogt est largement reconnu pour son intégration réfléchie des technologies émergentes.
about-team-cap6=Shu Guo
about-team-cap7=Fondateur, GeniusParentingAI
about-team-cap8=Maîtrise en éducation, Université de la Colombie-Britannique
about-team-cap9=Shu Guo est un éducateur titulaire d'une maîtrise en éducation de l'Université de la Colombie-Britannique et d'une vaste expérience de travail avec les enfants et les familles.
about-team-cap10=GeniusParentingAI n'est pas né de l'idée d'une parentalité parfaite, mais d'une expérience réelle et vécue.
about-team-cap11=À travers ces défis, elle a développé une conviction fondamentale : l’échec n’est pas l’opposé d’une bonne parentalité – c’est souvent le point de départ d’un apprentissage significatif.
about-team-cap12=Cette philosophie façonne les fondements de GeniusParentingAI : un soutien compatissant, des conseils pratiques et des informations fondées sur des données probantes pour de vraies familles confrontées à de réels défis.
about-team-cap13=James Tang
about-team-cap14=Architecte Full-Stack et créateur de produits IA
about-team-cap15=Master en CS, Université Fairleigh Dickinson
about-team-cap16=James Tang est un architecte full-stack et un constructeur de produits axé sur l'IA avec plus de 20 ans d'expérience dans la transformation d'idées complexes en systèmes logiciels évolutifs et hautes performances.
about-team-cap17=Il a dirigé des équipes d'ingénierie pour des produits d'entreprise mondiaux et créé des applications mobiles et Web basées sur l'IA, du concept au lancement.
about-team-cap18=James estime qu'un logiciel exceptionnel repose sur des fondamentaux solides, une architecture épurée et une exécution disciplinée.
about-trust-title=Pourquoi les familles nous font confiance
about-trust-1-title=Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.
about-trust-1-text=Nos cadres sont développés et guidés par la direction pédagogique de l'UBC, la surveillance du conseil consultatif et les collaborateurs EdTech — de sorte que les conseils restent ancrés dans la pratique pédagogique réelle.
about-trust-2-title=Confiance technologique
about-trust-2-text=L'IA est formée sur des cadres éducatifs approuvés par des experts plutôt que sur des forums aléatoires, ce qui signifie moins d'hallucinations et un soutien qui reste responsable.
about-trust-3-title=Confiance pratique
about-trust-3-text=Les conseils sont façonnés par les défis parentaux réels et par la vie familiale quotidienne. Ils sont donc utiles à 3 heures du matin, et pas seulement en théorie.
