seg-community.hero.body=Nous avons créé la Communauté pour un lieu sûr et solidaire où les parents peuvent poser des questions, partager leurs expériences et apprendre les uns des autres.
seg-community.ai.title=Pour vous aider à trouver rapidement le bon support, chaque discussion est automatiquement organisée selon nos 6 piliers d'apprentissage utilisant l'IA.
seg-community.ai.body=Cela signifie qu'il est plus facile de naviguer, de rechercher des sujets importants et de trouver les conseils parentaux dont vous avez besoin, sans faire défiler sans fin.
seg-community.ai.also=Vous pouvez également :
seg-community.ai.card=Rejoignez les conversations, posez des questions et soutenez les autres parents dans un environnement respectueux et sans jugement.
