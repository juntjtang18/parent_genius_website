seg-school-top-caption-34=École et Vie Sociale
seg-school-top-caption-35=Du premier jour de crèche à la navigation dans les cliques adolescentes, l'école et les amitiés façonnent le monde d'un enfant. Les parents peuvent être l'ancre — soutenant l'apprentissage, les compétences sociales et la résilience lorsque des défis se présentent.
seg-school-top-caption-37=Téléchargez l'application
seg-school-top-caption-101=Pourquoi c'est important
seg-school-top-caption-102=Des études de l'Université McGill montrent que les enfants qui se sentent soutenus socialement sont plus susceptibles de réussir académiquement. Les relations entre pairs et la collaboration parent-école jouent un rôle majeur dans la confiance, l'identité et le leadership futur.
seg-emotion-bottom-caption-19=Parenting
seg-emotion-bottom-caption-20=à portée de main
seg-emotion-bottom-caption-33=Chez Genius Parenting AI, nous croyons que lorsque les parents se sentent soutenus, les enfants s'épanouissent. Et lorsque les enfants s'épanouissent, l'avenir devient plus radieux pour nous tous.
seg-emotion-bottom-caption-24=Téléchargez l'application !
seg-emotion-bottom-caption-25=Essai gratuit. Pas de carte de crédit nécessaire.
seg-parenting-bottom-caption-19=Parenting
seg-parenting-bottom-caption-20=à portée de main
seg-parenting-bottom-caption-33=Téléchargez Genius Parenting AI et allégez votre expérience parentale.
seg-parenting-bottom-caption-24=Téléchargez l'application !
seg-parenting-bottom-caption-25=Essai gratuit. Pas de carte de crédit nécessaire.
seg-growth-top-caption-34=Croissance et Jalons
seg-growth-top-caption-35=Chaque étape de l'enfance apporte une nouvelle croissance — des premiers pas aux premiers examens. Suivre les jalons n'est pas une question de comparaison, mais de célébration des progrès et de savoir quand soutenir une aide supplémentaire.
seg-growth-top-caption-37=Téléchargez l'application
seg-growth-top-caption-101=Pourquoi c'est important
seg-growth-top-caption-102=La psychologie développementale (Piaget, Erikson) montre que chaque étape apporte des opportunités et des risques uniques. Comprendre où se trouve votre enfant vous aide à répondre avec empathie — et non avec pression.
seg-emotion-top-caption-34=Développement Émotionnel
seg-emotion-top-caption-35=Élever un enfant ne concerne pas seulement les jalons — il s'agit d'émotions. Aider les enfants à nommer, gérer et exprimer leurs sentiments établit la base d'une résilience à vie et de relations saines.
seg-emotion-top-caption-37=Téléchargez l'application
seg-emotion-top-caption-101=Pourquoi c'est important
seg-emotion-top-caption-102=Des recherches de la Société canadienne de pédiatrie montrent que les enfants qui grandissent avec un soutien émotionnel fort sont plus confiants, moins anxieux et meilleurs en résolution de problèmes. Les parents avec une haute intelligence émotionnelle (QE) élèvent des enfants qui prospèrent non seulement à l'école, mais aussi dans les amitiés et les futurs lieux de travail.
index-caption-19=Parenting
index-caption-20=à portée de main
about-caption-33=Téléchargez Genius Parenting AI et allégez votre expérience parentale.
index-caption-24=Téléchargez l'application !
index-caption-25=Essai gratuit. Pas de carte de crédit nécessaire.
seg-parenting-top-caption-34=Ressources Parentales
seg-parenting-top-caption-35=La parentalité n'est pas censée se faire seul. Ce pilier vous apporte des guides pratiques, des outils et des conseils — tout, des routines quotidiennes aux limites technologiques — pour que vous vous sentiez soutenu, pas accablé.
seg-parenting-top-caption-37=Téléchargez l'application
seg-parenting-top-caption-101=Pourquoi c'est important
seg-parenting-top-caption-102=La parentalité est le seul emploi sans formation formelle. L'accès à des ressources basées sur des preuves aide les parents à se sentir moins isolés et plus autonomes. Il ne s'agit pas de « parentalité parfaite » — il s'agit d'avoir les bons outils au bon moment.
