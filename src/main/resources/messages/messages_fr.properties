faq.a.ai.used.no2=Remplacer les conseils d'un professionnel
faq.a.ai.used.no3=Prendre des décisions pour les familles
faq.a.ai.used.p3=L’IA est un partenaire de réflexion et ne remplace pas les soins humains.
faq.q.ai.therapy=Est-ce un remplacement d’une thérapie ou d’un avis médical ?
faq.a.ai.therapy.p1=Non.
faq.a.ai.therapy.p2=GeniusParentingAI est une plateforme de soutien pédagogique et ne remplace pas :
faq.a.ai.therapy.li1=Soins médicaux
faq.a.ai.therapy.li2=Traitement de santé mentale
