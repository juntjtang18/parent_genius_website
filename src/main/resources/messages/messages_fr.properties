faq.title=FAQ - GeniusParentingAI
faq.title=Questions Fréquemment Posées
faq.section.about=À propos de GeniusParentingAI
faq.q.about.created=Qui a créé GeniusParentingAI ?
faq.a.about.created.p1=GeniusParentingAI a été fondée par un éducateur et professionnel du logiciel possédant une expertise dans les domaines de l'éducation, du développement de l'enfant, de la technologie et de l'IA.
faq.a.about.created.p2=Il a été construit sur une conviction simple :
faq.a.about.created.belief=Les parents méritent un soutien fiable, pratique et sans jugement alors qu’ils relèvent les défis quotidiens liés à l’éducation des enfants, en particulier dans des communautés diverses et multiculturelles.
faq.a.about.created.p3=Plutôt que d'ajouter davantage d'informations parentales sur Internet, GeniusParentingAI rassemble une expertise pédagogique, une IA responsable et des conseils pratiques pour aider les familles à prendre des décisions en toute confiance, une étape à la fois.
faq.section.for=À qui s’adresse-t-il ?
faq.q.for.who=À qui s’adresse GeniusParentingAI ?
faq.a.for.who.p1=GeniusParentingAI est conçu pour :
faq.a.for.who.li1=Parents et tuteurs
faq.a.for.who.li3=Familles immigrantes et multiculturelles
faq.a.for.who.li4=Éducateurs et praticiens
faq.a.for.who.li5=Des institutions axées sur le bien-être familial
faq.a.for.who.p2=Vous n’avez pas besoin d’être un « parent parfait » pour appartenir ici.
faq.a.for.who.p3=Si vous souhaitez élever des enfants réfléchis et résilients, vous êtes au bon endroit.
faq.q.for.diff=Qu’est-ce qui différencie GeniusParentingAI ?
faq.a.for.diff.p1=De nombreux sites Web destinés aux parents proposent des informations. GeniusParentingAI est conçu pour aider les parents à apprendre, à réfléchir et à prendre des décisions en toute confiance, et pas seulement à rechercher des réponses.
faq.a.for.diff.p2=Notre approche repose sur cinq principes :
faq.a.for.diff.li1=Fondé sur l’éducation – Développé avec une expertise pédagogique et éclairé par des recherches fondées sur des données probantes sur le développement et l’apprentissage de l’enfant.
faq.a.for.diff.li2=L’IA qui guide, et non remplace – L’IA responsable aide les parents à découvrir des apprentissages pertinents, des stratégies pratiques et des ressources fiables tout en encourageant une prise de décision réfléchie.
faq.a.for.diff.li3=Confidentialité dès la conception – Les parents peuvent explorer et apprendre de manière anonyme. Nous ne collectons que le minimum d’informations nécessaires et ne construisons jamais la plateforme autour de la publicité ou de la vente de données personnelles.
faq.a.for.diff.li4=Pratique pour la vie familiale au quotidien – Nos cours, exemples et activités sont conçus pour s’adapter naturellement aux situations parentales réelles, avec des conseils adaptés aux différents âges et stades de développement.
faq.a.for.diff.li5=Construit dans le respect de chaque famille – Nous reconnaissons que chaque famille est unique. Notre objectif est de fournir un soutien inclusif, sans jugement, qui respecte les différentes cultures, valeurs et parcours parentaux.
faq.a.for.diff.p3=Plutôt que de dire aux parents quoi faire, GeniusParentingAI aide les familles à acquérir des connaissances, de la confiance et des compétences pratiques : une conversation, un cours et une petite étape à la fois.
faq.section.app=Que puis-je faire sur l'application ?
faq.q.app.do=Que puis-je faire sur GeniusParentingAI ?
faq.a.app.do.p1=Dans GeniusParentingAI, vous pouvez accéder à :
