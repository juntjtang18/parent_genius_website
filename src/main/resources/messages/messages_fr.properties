home.why.title_en=Pourquoi Genius Parenting AI ?
home.why.intro=Nos conseils s’appuient sur des cadres pédagogiques éprouvés – et non sur des suppositions génériques de l’IA. Cela signifie moins d’hallucinations et un soutien fiable.
home.why.card1.title_en=Construit sur l’expertise pédagogique
home.why.card1.text_en=Conçu avec des spécialistes liés à l'Université de la Colombie-Britannique, chaque recommandation est fondée sur une pratique pédagogique réelle.
home.why.learn_en=En savoir plus →
home.why.card2.title_en=IA responsable
home.why.card2.text_en=Formé sur des cadres approuvés par des experts plutôt que sur des forums aléatoires, les réponses restent donc éducatives et non improvisées.
home.why.learn_en=En savoir plus →
