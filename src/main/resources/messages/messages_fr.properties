faq.a.lang.support.p3=Notre objectif est de rendre le soutien parental inclusif et accessible.
faq.section.privacy=Confidentialité et éthique
faq.q.privacy.collect=Collectez-vous des informations personnelles ?
faq.a.privacy.collect.p1=Non, c'est l'un de nos principes fondamentaux.
faq.a.privacy.collect.li1=Aucune exigence de nom réel
faq.a.privacy.collect.li2=Pas d'e-mail vérifié obligatoire
faq.a.privacy.collect.li3=Aucune donnée permettant d'identifier l'enfant n'est requise
faq.a.privacy.collect.li4=Collecte de données minimale par conception
faq.a.privacy.collect.p2=GeniusParentingAI est conçu pour soutenir les familles, et non pour récolter des données.
faq.q.privacy.anon=Mes informations sont-elles anonymes ?
faq.a.privacy.anon.p1=Oui.
faq.a.privacy.anon.p2=La plateforme est anonyme par défaut. Vous pouvez explorer librement sans révéler votre identité.
faq.q.privacy.share=Vendez-vous ou partagez-vous des données utilisateur ?
faq.a.privacy.share.p1=Jamais.
faq.a.privacy.share.p2=Nous ne vendons pas de données utilisateur.
