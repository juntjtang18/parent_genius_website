home.credentials.title=Contrairement aux outils d'IA génériques, GeniusParentingAI est construit par de vrais éducateurs. Notre plateforme et nos frameworks sont développés et guidés par :
home.credentials.1.title=Leadership pédagogique de l'UBC
home.credentials.1.text=L'équipe fondatrice est titulaire d'une maîtrise en éducation des adultes de l'UBC.
home.credentials.2.title=Surveillance distinguée du conseil d’administration
home.credentials.2.text=Comprend un professeur d'éducation de l'UBC au sein du conseil consultatif.
home.credentials.3.title=Experts en technologies éducatives
home.credentials.3.text=Nous exprimons notre sincère gratitude aux enseignants et aux étudiants diplômés du programme de maîtrise en technologie éducative de l'Université de la Colombie-Britannique pour leurs conseils continus et leurs précieuses contributions. Leur expertise et leur soutien ont joué un rôle important dans la transformation de GeniusParentingAI en une plateforme plus professionnelle, innovante et plus percutante.
