pillars.title=Le cadre GeniusParentingAI Whole Child
pillars.hero.title=Le GeniusParentingAI Whole Child Framework™
pillars.hero.sub=Comprendre les enfants. Autonomiser les parents. Renforcer les familles.
pillars.intro.title=Chaque parent veut le meilleur pour son enfant.
pillars.intro.p1=Pourtant, le fait d'être parent peut sembler accablant lorsque vous êtes confronté à des comportements difficiles, à des hauts et des bas émotionnels, à des problèmes scolaires, à des difficultés sociales ou aux changements rapides apportés par la technologie d'aujourd'hui. Il est naturel de rechercher des réponses rapides, mais les enfants sont rarement aussi simples.
pillars.intro.p2=La plupart des ressources parentales se concentrent sur la résolution d'un problème à la fois : crises de colère, anxiété, devoirs, temps passé devant un écran, TDAH, amitiés ou régulation émotionnelle.
pillars.intro.p3=Mais les enfants ne grandissent pas dans des catégories isolées. Les émotions d'un enfant affectent l'apprentissage. Le traitement sensoriel influence le comportement. Le fonctionnement exécutif a un impact sur les amitiés. La communication façonne la confiance. Les routines familiales affectent le bien-être émotionnel. Chaque partie du développement est connectée.
pillars.intro.p4=Lorsque nous nous concentrons sur un seul défi, nous risquons de négliger les facteurs sous-jacents qui le sous-tendent. C'est pourquoi GeniusParentingAI est construit différemment.
pillars.intro.mission_label=Notre mission est simple :
pillars.intro.mission=Comprendre les enfants. Autonomiser les parents. Renforcer les familles.
pillars.intro.mission_p1=Nous pensons que lorsque les parents comprennent réellement comment le développement de leur enfant s'articule, ils peuvent prendre des décisions plus confiantes, réagir avec plus d'empathie et bâtir des familles plus fortes et plus connectées.
pillars.intro.mission_p2=Au lieu de traiter la parentalité comme un ensemble de sujets distincts, nous organisons l'apprentissage autour de six piliers d'apprentissage connectés qui aident les parents à comprendre l'enfant dans son ensemble. Chaque pilier offre une perspective différente et, ensemble, ils créent une image complète de la croissance, des forces et des défis de votre enfant.
pillars.intro.puzzle=Considérez le développement de votre enfant comme un casse-tête. Un élément peut expliquer une partie de ce que vous voyez, mais aucun élément ne raconte toute l’histoire. À mesure que davantage d’éléments s’assemblent, les schémas deviennent plus clairs, les solutions deviennent plus efficaces et les parents deviennent plus confiants.
pillars.intro.together=Nos piliers d’apprentissage sont conçus pour fonctionner ensemble afin que vous puissiez :
pillars.check.1=Comprenez pourquoi un comportement ou un défi peut se produire.
pillars.check.2=Reconnaissez comment les différents domaines de développement s’influencent mutuellement.
pillars.check.3=Apprenez des stratégies pratiques et fondées sur des données probantes qui conviennent à votre enfant et à votre famille.
pillars.check.4=Découvrez des sujets connexes qui peuvent fournir des informations et une assistance supplémentaires.
pillars.intro.close_title=Vous n'avez pas besoin de devenir un expert en développement de l'enfant.
pillars.intro.close=Nous vous guiderons à travers les connexions, vous recommanderons les prochaines étapes d'apprentissage et vous aiderons à renforcer votre confiance, étape par étape. L'objectif n'est pas simplement de résoudre le problème d'aujourd'hui, il s'agit d'aider votre enfant à s'épanouir émotionnellement, socialement, académiquement et dans la vie de tous les jours.
pillars.grid.title=Nos six piliers d'apprentissage
pillars.grid.sub=Ensemble, nos six piliers d'apprentissage créent un écosystème parental connecté qui soutient l'enfant dans son ensemble plutôt que des défis isolés.
pillars.grid.cta=Voir les cours
pillars.promise.title=Notre promesse
pillars.promise.sub=Nous ne vous dirons pas simplement ce que votre enfant peut vivre. Nous vous aiderons à comprendre
pillars.promise.1=Pourquoi cela peut se produire.
pillars.promise.2=Comment les différents domaines de développement sont connectés.
pillars.promise.3=Quelles stratégies pratiques vous pouvez utiliser aujourd’hui.
pillars.promise.4=Où aller ensuite pour un apprentissage plus approfondi et un soutien continu.
pillars.promise.text=Chaque leçon, chaque recommandation d'IA, chaque ressource téléchargeable et chaque pilier d'apprentissage est conçu dans un seul objectif : vous aider à mieux comprendre votre enfant et à soutenir son parcours unique en toute confiance.
pillars.promise.text2=Parce que lorsque les parents comprennent l’enfant dans son ensemble (et pas seulement le défi), ils prennent de meilleures décisions, construisent des relations plus solides et créent un changement positif durable pour leur famille.
pillars.philosophy.title=Notre philosophie
pillars.philosophy.mission=Comprendre les enfants. Autonomiser les parents. Renforcer les familles.
pillars.philosophy.sub=Chaque enfant est unique. Chaque défi est connecté. Chaque famille peut apprendre.
