pillars.title=The GeniusParentingAI Whole Child Framework
pillars.hero.title=The GeniusParentingAI Whole Child Framework™
pillars.hero.sub=Understanding Children. Empowering Parents. Strengthening Families.
pillars.intro.title=Every parent wants the very best for their child.
pillars.intro.p1=Yet parenting can feel overwhelming when you're faced with challenging behaviours, emotional ups and downs, school concerns, social difficulties, or the rapid changes brought by today's technology. It's natural to look for quick answers—but children are rarely that simple.
pillars.intro.p2=Most parenting resources focus on solving one problem at a time: tantrums, anxiety, homework, screen time, ADHD, friendships, or emotional regulation.
pillars.intro.p3=But children don't grow in isolated categories. A child's emotions affect learning. Sensory processing influences behaviour. Executive functioning impacts friendships. Communication shapes confidence. Family routines affect emotional wellbeing. Every part of development is connected.
pillars.intro.p4=When we focus on only one challenge, we may overlook the underlying factors driving it. That's why GeniusParentingAI is built differently.
pillars.intro.mission_label=Our mission is simple:
pillars.intro.mission=Understanding Children. Empowering Parents. Strengthening Families.
pillars.intro.mission_p1=We believe that when parents truly understand how their child's development fits together, they can make more confident decisions, respond with greater empathy, and build stronger, more connected families.
pillars.intro.mission_p2=Instead of treating parenting as a collection of separate topics, we organize learning around six connected Learning Pillars that help parents understand the whole child. Each pillar offers a different perspective, and together they create a complete picture of your child's growth, strengths, and challenges.
pillars.intro.puzzle=Think of your child's development as a puzzle. One piece may explain part of what you see, but no single piece tells the whole story. As more pieces come together, patterns become clearer, solutions become more effective, and parenting becomes more confident.
pillars.intro.together=Our Learning Pillars are designed to work together so you can:
pillars.check.1=Understand why a behaviour or challenge may be happening.
pillars.check.2=Recognize how different areas of development influence one another.
pillars.check.3=Learn practical, evidence-informed strategies that fit your child and family.
pillars.check.4=Discover related topics that may provide additional insight and support.
pillars.intro.close_title=You don't need to become an expert in child development.
pillars.intro.close=We'll guide you through the connections, recommend the next learning steps, and help you build confidence one step at a time. The goal isn't simply to solve today's problem—it's to help your child thrive emotionally, socially, academically, and in everyday life.
pillars.grid.title=Our Six Learning Pillars
pillars.grid.sub=Together, our six Learning Pillars create a connected parenting ecosystem that supports the whole child rather than isolated challenges.
pillars.grid.cta=View Courses
pillars.promise.title=Our Promise
pillars.promise.sub=We won't simply tell you what your child may be experiencing. We'll help you understand
pillars.promise.1=Why it may be happening.
pillars.promise.2=How different developmental areas are connected.
pillars.promise.3=What practical strategies you can use today.
pillars.promise.4=Where to go next for deeper learning and ongoing support.
pillars.promise.text=Every lesson, every AI recommendation, every downloadable resource, and every Learning Pillar is designed with one purpose: to help you better understand your child and support their unique journey with confidence.
pillars.promise.text2=Because when parents understand the whole child—not just the challenge—they make better decisions, build stronger relationships, and create lasting positive change for their families.
pillars.philosophy.title=Our Philosophy
pillars.philosophy.mission=Understanding Children. Empowering Parents. Strengthening Families.
pillars.philosophy.sub=Every Child is Unique. Every Challenge is Connected. Every Family Can Learn.
