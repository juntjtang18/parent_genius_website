about-hero-title=Why Families Trust Us.
about-hero-text=Every parent's journey begins with a question: "Am I ready? Am I doing this right?" Parenting doesn't come with a manual. And that feeling is universal: the need for support, reassurance, and guidance that actually fits your life. You don't have to figure it out alone.
about-care-title=Our Core Belief
about-believe-cap5=GeniusParentingAI exists to help parents build strong foundational knowledge, avoid common pitfalls, and make thoughtful, informed decisions that support their children’s long-term well-being.
about-believe-cap6=By combining educational expertise, technological innovation, and real-life parenting insight, our platform aims to benefit families, educators, practitioners, and institutions — while also supporting research, communication, and collaboration across the broader child and family well-being community.
about-caption-50=Our Vision
about-caption-51=To empower parents with the knowledge, tools, and support they need to create loving, supportive families that nurture growth, foster resilience, and inspire the next generation to thrive with confidence, compassion, and curiosity.
about-caption-52=Our Mission
about-caption-53=Our mission is to provide parents with actionable insights, expert advice, and innovative resources, helping them create nurturing environments where children can grow, thrive, and develop the skills they need to succeed in life.
about-team-title=Our Team
about-team-cap1=Dr. David Vogt
about-team-cap2=Advisory Board Member
about-team-cap3=Professor, University of British Columbia
about-team-cap4=Dr. David Vogt is a professor at the University of British Columbia and an accomplished innovation leader.
about-team-cap5=With decades of experience at the intersection of science, leadership, and public education, Dr. Vogt is widely recognized for his thoughtful integration of emerging technologies.
about-team-cap6=Shu Guo
about-team-cap7=Founder, GeniusParentingAI
about-team-cap8=Master of Education, University of British Columbia
about-team-cap9=Shu Guo is an educator with a Master of Education from the University of British Columbia and extensive experience working with children and families.
about-team-cap10=GeniusParentingAI was not born from the idea of perfect parenting — but from real, lived experience.
about-team-cap11=Through these challenges, she developed a core belief: failure is not the opposite of good parenting — it is often where meaningful learning begins.
about-team-cap12=This philosophy shapes the foundation of GeniusParentingAI: compassionate support, practical guidance, and evidence-informed insight for real families facing real challenges.
about-team-cap13=James Tang
about-team-cap14=Full-Stack Architect & AI Product Builder
about-team-cap15=Master of CS, Fairleigh Dickinson University
about-team-cap16=James Tang is a full-stack architect and AI-focused product builder with more than 20 years of experience transforming complex ideas into scalable, high-performance software systems.
about-team-cap17=He has led engineering teams for global enterprise products and built AI-powered mobile and web applications from concept to launch.
about-team-cap18=James believes that exceptional software is built on strong fundamentals, clean architecture, and disciplined execution.
about-trust-title=Why Families Trust Us
about-trust-1-title=Academic & Educational Trust
about-trust-1-text=Our frameworks are developed and guided by UBC educational leadership, advisory board oversight, and EdTech collaborators — so guidance stays grounded in real teaching practice.
about-trust-2-title=Technological Trust
about-trust-2-text=The AI is trained on expert-vetted educational frameworks rather than random forums, which means fewer hallucinations and support that stays responsible.
about-trust-3-title=Practical Trust
about-trust-3-text=Advice is shaped by real parenting challenges and everyday family life, so it is useful at 3AM — not only in theory.
