about-team-cap3=प्रोफेसर, ब्रिटिश कोलंबिया विश्वविद्यालय
about-team-cap4=डॉ. डेविड वोग्ट ब्रिटिश कोलंबिया विश्वविद्यालय में प्रोफेसर और एक कुशल नवाचार नेता हैं।
about-team-cap5=विज्ञान, नेतृत्व और सार्वजनिक शिक्षा के क्षेत्र में दशकों के अनुभव के साथ, डॉ. वोग्ट को उभरती प्रौद्योगिकियों के विचारशील एकीकरण के लिए व्यापक रूप से मान्यता प्राप्त है।
