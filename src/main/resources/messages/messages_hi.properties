pillars.hero.title=GeniusParentingAI होल चाइल्ड फ्रेमवर्क™
pillars.hero.sub=बच्चों को समझना. माता-पिता को सशक्त बनाना. परिवारों को मजबूत बनाना.
pillars.intro.title=हर माता-पिता अपने बच्चे के लिए सर्वोत्तम चाहते हैं।
pillars.intro.p1=फिर भी जब आप चुनौतीपूर्ण व्यवहार, भावनात्मक उतार-चढ़ाव, स्कूल की चिंताओं, सामाजिक कठिनाइयों, या आज की तकनीक द्वारा लाए गए तीव्र बदलावों का सामना करते हैं तो पालन-पोषण करना भारी लग सकता है। त्वरित उत्तर की तलाश करना स्वाभाविक है-लेकिन बच्चे शायद ही कभी इतने सरल होते हैं।
pillars.intro.p2=अधिकांश पेरेंटिंग संसाधन एक समय में एक ही समस्या को हल करने पर ध्यान केंद्रित करते हैं: नखरे, चिंता, होमवर्क, स्क्रीन समय, एडीएचडी, दोस्ती, या भावनात्मक विनियमन।
pillars.intro.p3=लेकिन बच्चे पृथक श्रेणियों में विकसित नहीं होते। बच्चे की भावनाएँ सीखने को प्रभावित करती हैं। संवेदी प्रसंस्करण व्यवहार को प्रभावित करता है। कार्यकारी कार्यप्रणाली मित्रता पर प्रभाव डालती है। संचार आत्मविश्वास को आकार देता है। पारिवारिक दिनचर्या भावनात्मक भलाई को प्रभावित करती है। विकास का हर हिस्सा जुड़ा हुआ है.
pillars.intro.p4=जब हम केवल एक चुनौती पर ध्यान केंद्रित करते हैं, तो हम इसे चलाने वाले अंतर्निहित कारकों को नजरअंदाज कर सकते हैं। इसीलिए GeniusParentingAI को अलग तरीके से बनाया गया है।
pillars.intro.mission_label=हमारा मिशन सरल है:
pillars.intro.mission=बच्चों को समझना. माता-पिता को सशक्त बनाना. परिवारों को मजबूत बनाना.
pillars.intro.mission_p1=हमारा मानना ​​है कि जब माता-पिता वास्तव में समझते हैं कि उनके बच्चे का विकास एक साथ कैसे होता है, तो वे अधिक आत्मविश्वासपूर्ण निर्णय ले सकते हैं, अधिक सहानुभूति के साथ प्रतिक्रिया दे सकते हैं और मजबूत, अधिक जुड़े हुए परिवारों का निर्माण कर सकते हैं।
pillars.intro.mission_p2=पालन-पोषण को अलग-अलग विषयों के संग्रह के रूप में मानने के बजाय, हम छह जुड़े हुए शिक्षण स्तंभों के आसपास सीखने का आयोजन करते हैं जो माता-पिता को पूरे बच्चे को समझने में मदद करते हैं। प्रत्येक स्तंभ एक अलग दृष्टिकोण प्रस्तुत करता है, और साथ में वे आपके बच्चे के विकास, ताकत और चुनौतियों की एक पूरी तस्वीर बनाते हैं।
pillars.intro.puzzle=अपने बच्चे के विकास को एक पहेली के रूप में सोचें। एक टुकड़ा आप जो देखते हैं उसका कुछ हिस्सा समझा सकता है, लेकिन कोई भी टुकड़ा पूरी कहानी नहीं बताता है। जैसे-जैसे अधिक टुकड़े एक साथ आते हैं, पैटर्न स्पष्ट हो जाते हैं, समाधान अधिक प्रभावी हो जाते हैं, और पालन-पोषण अधिक आश्वस्त हो जाता है।
pillars.intro.together=हमारे शिक्षण स्तंभ एक साथ काम करने के लिए डिज़ाइन किए गए हैं ताकि आप:
pillars.check.1=समझें कि कोई व्यवहार या चुनौती क्यों हो रही है।
pillars.check.2=पहचानें कि विकास के विभिन्न क्षेत्र एक-दूसरे को कैसे प्रभावित करते हैं।
pillars.check.3=व्यावहारिक, साक्ष्य-आधारित रणनीतियाँ सीखें जो आपके बच्चे और परिवार के लिए उपयुक्त हों।
pillars.check.4=संबंधित विषयों की खोज करें जो अतिरिक्त जानकारी और सहायता प्रदान कर सकते हैं।
pillars.intro.close_title=आपको बाल विकास में विशेषज्ञ बनने की आवश्यकता नहीं है।
pillars.intro.close=हम आपको कनेक्शन के माध्यम से मार्गदर्शन करेंगे, अगले सीखने के चरणों की अनुशंसा करेंगे, और एक समय में एक कदम पर आत्मविश्वास बनाने में आपकी सहायता करेंगे। लक्ष्य केवल आज की समस्या को हल करना नहीं है - यह आपके बच्चे को भावनात्मक, सामाजिक, शैक्षणिक और रोजमर्रा की जिंदगी में आगे बढ़ने में मदद करना है।
pillars.grid.title=हमारे छह सीखने के स्तंभ
pillars.grid.sub=साथ में, हमारे छह शिक्षण स्तंभ एक जुड़े हुए पालन-पोषण पारिस्थितिकी तंत्र का निर्माण करते हैं जो अलग-अलग चुनौतियों के बजाय पूरे बच्चे का समर्थन करता है।
pillars.grid.cta=पाठ्यक्रम देखें
pillars.promise.title=हमारा वायदा
pillars.promise.sub=हम आपको केवल यह नहीं बताएंगे कि आपका बच्चा क्या अनुभव कर रहा होगा। हम आपको समझने में मदद करेंगे
pillars.promise.1=ऐसा क्यों हो रहा होगा.
pillars.promise.2=विभिन्न विकासात्मक क्षेत्र कैसे जुड़े हुए हैं।
pillars.promise.3=आज आप किन व्यावहारिक रणनीतियों का उपयोग कर सकते हैं।
pillars.promise.4=गहन शिक्षा और निरंतर समर्थन के लिए आगे कहां जाएं।
pillars.promise.text=प्रत्येक पाठ, प्रत्येक एआई अनुशंसा, प्रत्येक डाउनलोड करने योग्य संसाधन, और प्रत्येक शिक्षण स्तंभ एक उद्देश्य से डिज़ाइन किया गया है: आपको अपने बच्चे को बेहतर ढंग से समझने में मदद करना और आत्मविश्वास के साथ उनकी अनूठी यात्रा का समर्थन करना।
