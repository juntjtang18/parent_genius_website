seg-community.hero.title=हमारे समुदाय में आपका स्वागत है
seg-community.hero.body=हमने एक सुरक्षित और सहायक स्थान के लिए समुदाय बनाया है जहां माता-पिता प्रश्न पूछ सकते हैं, अनुभव साझा कर सकते हैं और एक-दूसरे से सीख सकते हैं।
seg-community.ai.title=आपको तुरंत सही समर्थन ढूंढने में मदद करने के लिए, प्रत्येक चर्चा स्वचालित रूप से एआई का उपयोग करके हमारे 6 शिक्षण स्तंभों में व्यवस्थित होती है।
seg-community.ai.body=इसका मतलब है कि नेविगेट करना, महत्वपूर्ण विषयों की खोज करना और आपको आवश्यक पेरेंटिंग सलाह ढूंढना आसान है - अंतहीन स्क्रॉलिंग के बिना।
seg-community.ai.also=आप यह भी कर सकते हैं:
seg-community.ai.card=बातचीत में शामिल हों, प्रश्न पूछें और सम्मानजनक, निर्णय-मुक्त वातावरण में अन्य माता-पिता का समर्थन करें।
seg-community.ai.card=बातचीत में शामिल हों, प्रश्न पूछें और सम्मानजनक, निर्णय-मुक्त वातावरण में अन्य माता-पिता का समर्थन करें।
seg-community.ai.card=बातचीत में शामिल हों, प्रश्न पूछें और सम्मानजनक, निर्णय-मुक्त वातावरण में अन्य माता-पिता का समर्थन करें।
seg-community.values.lead=साथ मिलकर, हम एक ऐसा समुदाय बना रहे हैं जहाँ माता-पिता सीखते हैं, जुड़ते हैं और बढ़ते हैं—एक समय में एक बातचीत।
seg-community.values.title=जोड़ना। सीखना। सहायता।
seg-community.values.body=समान विचारधारा वाले माता-पिता के लिए एक ऐसा स्थान जहां आप आवश्यक जानकारीपूर्ण, आसानी से मिल जाने वाले मार्गदर्शन के साथ सहयोग कर सकते हैं।
seg-community.cta.title=क्योंकि एक बच्चे के पालन-पोषण के लिए एक गाँव की आवश्यकता होती है - और हम आपके लिए एक गाँव का निर्माण कर रहे हैं।
seg-community.cta.sub=समुदाय में शामिल हों और अपने विचार और समस्याएं साझा करें।
