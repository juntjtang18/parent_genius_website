home.why.title_en=जीनपेरेंटिंग एआई क्यों?
home.why.intro=हमारा मार्गदर्शन सिद्ध शैक्षिक ढांचे पर बनाया गया है - सामान्य एआई अनुमानों पर नहीं। इसका मतलब है कम मतिभ्रम, और समर्थन जिस पर आप भरोसा कर सकते हैं।
home.why.card1.title_en=शैक्षिक विशेषज्ञता पर निर्मित
home.why.card1.text_en=ब्रिटिश कोलंबिया विश्वविद्यालय से जुड़े विशेषज्ञों के साथ डिज़ाइन किया गया है, इसलिए प्रत्येक अनुशंसा वास्तविक शैक्षिक अभ्यास पर आधारित है।
home.why.learn_en=और अधिक जानें →
home.why.card2.title_en=जिम्मेदार ए.आई
home.why.card2.text_en=यादृच्छिक मंचों के बजाय विशेषज्ञ-परीक्षित ढांचे पर प्रशिक्षित, इसलिए उत्तर शैक्षिक बने रहते हैं - तात्कालिक नहीं।
home.why.learn_en=और अधिक जानें →
home.why.card3.title_en=गोपनीयता
home.why.card3.text_en=डिफ़ॉल्ट रूप से अज्ञात. कोई ट्रैकिंग परिवार नहीं, और कोई आपके डेटा की बिक्री नहीं।
home.why.learn_en=और अधिक जानें →
home.credentials.title=सामान्य एआई टूल के विपरीत, GeniusParentingAI वास्तविक शिक्षकों द्वारा बनाया गया है। हमारा प्लेटफ़ॉर्म और ढाँचा इनके द्वारा विकसित और निर्देशित हैं:
home.credentials.1.title=यूबीसी शैक्षिक नेतृत्व
home.credentials.1.text=संस्थापक टीम के पास यूबीसी से वयस्क शिक्षा में मास्टर डिग्री है।
home.credentials.2.title=प्रतिष्ठित बोर्ड निरीक्षण
home.credentials.2.text=सलाहकार बोर्ड में एक यूबीसी शिक्षा प्रोफेसर शामिल हैं।
home.credentials.3.title=एडटेक विशेषज्ञ
home.credentials.3.text=हम ब्रिटिश कोलंबिया विश्वविद्यालय में मास्टर ऑफ एजुकेशनल टेक्नोलॉजी कार्यक्रम के शिक्षकों और स्नातक छात्रों को उनके निरंतर मार्गदर्शन और मूल्यवान योगदान के लिए अपना हार्दिक आभार व्यक्त करते हैं। उनकी विशेषज्ञता और समर्थन ने GeniusParentingAI को एक अधिक पेशेवर, अभिनव और प्रभावशाली मंच में आकार देने में महत्वपूर्ण भूमिका निभाई है।
home.credentials.more=हमारी टीम और कार्यप्रणाली के बारे में और जानें →
home.cta.title=पालन-पोषण, बस एक टैप दूर
home.cta.text=रोजमर्रा के क्षणों के लिए त्वरित, शिक्षक-निर्देशित सलाह - और रास्ते में शांत मील के पत्थर।
