about-team-cap8=मास्टर ऑफ एजुकेशन, ब्रिटिश कोलंबिया विश्वविद्यालय
about-team-cap9=शू गुओ ब्रिटिश कोलंबिया विश्वविद्यालय से मास्टर ऑफ एजुकेशन के साथ एक शिक्षक हैं और उन्हें बच्चों और परिवारों के साथ काम करने का व्यापक अनुभव है।
about-team-cap10=GeniusParentingAI का जन्म संपूर्ण पालन-पोषण के विचार से नहीं हुआ था - बल्कि वास्तविक, जीवंत अनुभव से हुआ था।
about-team-cap11=इन चुनौतियों के माध्यम से, उसने एक मूल विश्वास विकसित किया: विफलता अच्छे पालन-पोषण के विपरीत नहीं है - अक्सर यहीं से सार्थक सीख शुरू होती है।
about-team-cap12=यह दर्शन GeniusParentingAI की नींव को आकार देता है: वास्तविक चुनौतियों का सामना करने वाले वास्तविक परिवारों के लिए दयालु समर्थन, व्यावहारिक मार्गदर्शन और साक्ष्य-सूचित अंतर्दृष्टि।
about-team-cap13=जेम्स टैंग
about-team-cap14=फुल-स्टैक आर्किटेक्ट और एआई उत्पाद निर्माता
about-team-cap15=सीएस के मास्टर, फेयरलेघ डिकिंसन विश्वविद्यालय
about-team-cap16=जेम्स टैंग एक फुल-स्टैक आर्किटेक्ट और एआई-केंद्रित उत्पाद निर्माता हैं, जिनके पास जटिल विचारों को स्केलेबल, उच्च-प्रदर्शन सॉफ्टवेयर सिस्टम में बदलने का 20 से अधिक वर्षों का अनुभव है।
about-team-cap17=उन्होंने वैश्विक उद्यम उत्पादों के लिए इंजीनियरिंग टीमों का नेतृत्व किया है और अवधारणा से लेकर लॉन्च तक एआई-संचालित मोबाइल और वेब एप्लिकेशन बनाए हैं।
about-team-cap18=जेम्स का मानना ​​है कि असाधारण सॉफ्टवेयर मजबूत बुनियादी सिद्धांतों, स्वच्छ वास्तुकला और अनुशासित निष्पादन पर बनाया गया है।
about-trust-title=परिवार हम पर भरोसा क्यों करते हैं?
about-trust-1-title=शैक्षणिक एवं शैक्षणिक ट्रस्ट
about-trust-1-text=हमारे ढांचे को यूबीसी शैक्षिक नेतृत्व, सलाहकार बोर्ड निरीक्षण और एडटेक सहयोगियों द्वारा विकसित और निर्देशित किया जाता है - इसलिए मार्गदर्शन वास्तविक शिक्षण अभ्यास पर आधारित रहता है।
about-trust-2-title=तकनीकी ट्रस्ट
about-trust-2-text=एआई को यादृच्छिक मंचों के बजाय विशेषज्ञ-परीक्षित शैक्षिक ढांचे पर प्रशिक्षित किया जाता है, जिसका अर्थ है कम मतिभ्रम और समर्थन जो जिम्मेदार रहता है।
about-trust-3-title=व्यावहारिक भरोसा
about-trust-3-text=सलाह वास्तविक पालन-पोषण की चुनौतियों और रोजमर्रा के पारिवारिक जीवन से आकार लेती है, इसलिए यह सुबह 3 बजे उपयोगी है - न कि केवल सिद्धांत में।
