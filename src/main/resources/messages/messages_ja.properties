pillars.title=GeniusParentingAI Whole Child フレームワーク
pillars.hero.title=GeniusParentingAI Whole Child Framework™
pillars.hero.sub=子どもたちを理解する。親に力を与える。家族を強める。
pillars.intro.title=すべての親は自分の子供に最善を尽くしたいと考えています。
pillars.intro.p1=しかし、子育ては、困難な行動、感情の浮き沈み、学校への懸念、社会的困難、または今日のテクノロジーによってもたらされる急速な変化に直面すると、圧倒されてしまうことがあります。すぐに答えを求めるのは自然なことですが、子どもがそれほど単純であることはめったにありません。
pillars.intro.p2=ほとんどの子育てリソースは、癇癪、不安、宿題、画面を見る時間、ADHD、友人関係、感情の制御など、一度に 1 つの問題を解決することに重点を置いています。
pillars.intro.p3=しかし、子供たちは孤立したカテゴリーの中で成長するわけではありません。子供の感情は学習に影響を与えます。感覚処理は行動に影響を与えます。執行機能は友情に影響を与えます。コミュニケーションは自信を形成します。家族の習慣は精神的な健康に影響を与えます。開発のあらゆる部分がつながっています。
pillars.intro.p4=1 つの課題だけに注目すると、それを推進する根本的な要因を見落とす可能性があります。 GeniusParentingAI が異なる方法で構築されているのはそのためです。
pillars.intro.mission_label=私たちの使命はシンプルです。
pillars.intro.mission=子どもたちを理解する。親に力を与える。家族を強める。
pillars.intro.mission_p1=私たちは、親が子供の発達がどのように調和しているかを真に理解すると、より自信を持って決定を下し、より共感をもって対応し、より強くつながりのある家族を築くことができると信じています。
pillars.intro.mission_p2=子育てを個別のトピックの集まりとして扱うのではなく、親が子ども全体を理解するのに役立つ 6 つの関連した学習の柱を中心に学習を構成します。それぞれの柱は異なる視点を提供し、それらを組み合わせることで、お子様の成長、強み、課題の全体像を作成します。
pillars.intro.puzzle=お子様の発達をパズルのように考えてください。 1 つの作品で見ているものの一部が説明されるかもしれませんが、1 つの作品で全体のストーリーが語られることはありません。より多くの要素を組み合わせると、パターンがより明確になり、解決策がより効果的になり、子育てに自信が持てるようになります。
pillars.intro.together=私たちの学習の柱は連携して機能するように設計されており、次のことが可能になります。
pillars.check.1=行動や課題がなぜ起こるのかを理解します。
pillars.check.2=開発のさまざまな分野が相互にどのような影響を与えるかを認識します。
pillars.check.3=お子様とご家族に合った、証拠に基づいた実践的な戦略を学びましょう。
pillars.check.4=追加の洞察とサポートを提供する可能性のある関連トピックを見つけてください。
pillars.intro.close_title=児童発達の専門家になる必要はありません。
pillars.intro.close=私たちはつながりをガイドし、次の学習ステップを推奨し、一歩ずつ自信を築くお手伝いをします。目標は単に今日の問題を解決することではなく、お子様が感情的、社会的、学業上、そして日常生活において成長できるよう支援することです。
