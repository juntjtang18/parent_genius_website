pillars.promise.text=すべてのレッスン、すべての AI 推奨事項、すべてのダウンロード可能なリソース、すべての学習の柱は、1 つの目的を持って設計されています。それは、お子様をより深く理解し、自信を持ってお子様の独自の学習をサポートできるようにすることです。
pillars.promise.text2=なぜなら、親が課題だけでなく子ども全体を理解すると、より良い決定を下し、より強い関係を築き、家族に永続的な前向きな変化を生み出すことができるからです。
