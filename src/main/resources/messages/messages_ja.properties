about-hero-title=家族が私たちを信頼する理由。
about-hero-text=すべての親の旅は、「準備はできていますか? 正しくやっているでしょうか?」という質問から始まります。子育てにマニュアルはありません。そしてその感情は普遍的なものであり、実際にあなたの人生に合ったサポート、安心感、そして導きが必要です。一人で解決する必要はありません。
about-care-title=私たちの核となる信念
about-believe-cap5=GeniusParentingAI は、親が強力な基礎知識を構築し、よくある落とし穴を回避し、子供の長期的な幸福をサポートする思慮深い情報に基づいた決定を下せるよう支援するために存在します。
about-believe-cap6=私たちのプラットフォームは、教育の専門知識、技術革新、実際の子育てに関する洞察を組み合わせることで、家族、教育者、実践者、教育機関に利益をもたらすことを目的としていると同時に、より広範な子どもと家族の福祉コミュニティ全体にわたる研究、コミュニケーション、コラボレーションをサポートしています。
about-caption-50=私たちのビジョン
about-caption-51=親が成長を促し、立ち直る力を育み、自信、思いやり、好奇心を持って成長するよう促す、愛情深く協力的な家族を築くために必要な知識、ツール、サポートを親に提供すること。
about-caption-52=私たちのミッション
about-caption-53=私たちの使命は、保護者に実用的な洞察、専門家のアドバイス、革新的なリソースを提供し、子供たちが成長し、成長し、人生で成功するために必要なスキルを身につけることができる養育環境の構築を支援することです。
about-team-title=私たちのチーム
about-team-cap1=デビッド・フォークト博士
about-team-cap2=諮問委員会メンバー
about-team-cap3=ブリティッシュコロンビア大学教授
about-team-cap4=David Vogt 博士は、ブリティッシュ コロンビア大学の教授であり、優れたイノベーションのリーダーです。
about-team-cap5=科学、リーダーシップ、公教育の交差点で数十年の経験を持つフォークト博士は、新興テクノロジーを思慮深く統合することで広く知られています。
about-team-cap6=シュウ・グオ
about-team-cap7=GeniusParentingAI 創設者
about-team-cap8=ブリティッシュコロンビア大学教育修士
about-team-cap9=Shu Guo は、ブリティッシュ コロンビア大学で教育修士号を取得した教育者であり、子供たちや家族と関わった豊富な経験があります。
about-team-cap10=GeniusParentingAI は、完璧な子育てという考えから生まれたのではなく、実際の生きた経験から生まれました。
about-team-cap11=これらの課題を通じて、彼女は「失敗は良い子育ての反対ではない。多くの場合、失敗から有意義な学びが始まる」という核となる信念を培いました。
about-team-cap12=この哲学は、GeniusParentingAI の基礎を形作ります。つまり、本当の課題に直面している実際の家族に対する思いやりのあるサポート、実践的な指導、証拠に基づいた洞察です。
about-team-cap13=ジェームス・タン
about-team-cap14=Error 500 (Server Error)!!1500.That’s an error.There was an error. Please try again later.That’s all we know.
about-team-cap15=フェアリー・ディキンソン大学、CS修士号
about-team-cap16=James Tang は、フルスタック アーキテクトであり、AI に重点を置いた製品ビルダーであり、複雑なアイデアをスケーラブルで高性能なソフトウェア システムに変換する 20 年以上の経験があります。
about-team-cap17=彼は、グローバル エンタープライズ製品のエンジニアリング チームを率い、コンセプトから立ち上げまで AI を活用したモバイルおよび Web アプリケーションを構築してきました。
about-team-cap18=James は、優れたソフトウェアは強力な基礎、クリーンなアーキテクチャ、規律ある実行に基づいて構築されると信じています。
about-trust-title=家族が私たちを信頼する理由
about-trust-1-title=学術および教育信託
about-trust-1-text=私たちのフレームワークは、UBC の教育リーダーシップ、諮問委員会の監督、EdTech 協力者によって開発および指導されているため、ガイダンスは実際の教育実践に基づいたものになります。
about-trust-2-title=技術的信頼
about-trust-2-text=AI は、ランダムなフォーラムではなく、専門家が精査した教育フレームワークに基づいてトレーニングされるため、幻覚が少なく、責任あるサポートが提供されます。
about-trust-3-title=実践的な信頼
about-trust-3-text=アドバイスは実際の子育ての課題や日常の家族生活によって形作られているため、理論だけでなく午前 3 時に役立ちます。
