about-team-cap3=ব্রিটিশ কলাম্বিয়া বিশ্ববিদ্যালয়ের অধ্যাপক ড
about-team-cap4=ডাঃ ডেভিড ভোগট ব্রিটিশ কলাম্বিয়া বিশ্ববিদ্যালয়ের একজন অধ্যাপক এবং একজন দক্ষ উদ্ভাবন নেতা।
about-team-cap5=বিজ্ঞান, নেতৃত্ব এবং জনশিক্ষার সংযোগস্থলে কয়েক দশকের অভিজ্ঞতার সাথে, ডক্টর ভোগট উদীয়মান প্রযুক্তির চিন্তাশীল একীকরণের জন্য ব্যাপকভাবে স্বীকৃত।
