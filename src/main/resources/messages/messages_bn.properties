about-team-cap7=প্রতিষ্ঠাতা, জিনিয়াস প্যারেন্টিংএআই
about-team-cap8=স্নাতকোত্তর শিক্ষা, ব্রিটিশ কলাম্বিয়া বিশ্ববিদ্যালয়
about-team-cap9=শু গুও ব্রিটিশ কলাম্বিয়া বিশ্ববিদ্যালয় থেকে শিক্ষার স্নাতকোত্তর সহ একজন শিক্ষাবিদ এবং শিশুদের এবং পরিবারের সাথে কাজ করার ব্যাপক অভিজ্ঞতা।
about-team-cap10=জিনিয়াস প্যারেন্টিংএআই নিখুঁত অভিভাবকত্বের ধারণা থেকে জন্মগ্রহণ করেনি — কিন্তু বাস্তব, জীবিত অভিজ্ঞতা থেকে।
about-team-cap11=এই চ্যালেঞ্জগুলির মাধ্যমে, তিনি একটি মূল বিশ্বাস গড়ে তুলেছিলেন: ব্যর্থতা ভাল অভিভাবকত্বের বিপরীত নয় - এটি প্রায়শই যেখানে অর্থপূর্ণ শিক্ষা শুরু হয়।
about-team-cap12=এই দর্শনটি জিনিয়াসপ্যারেন্টিংএআই-এর ভিত্তি তৈরি করে: সহানুভূতিশীল সমর্থন, ব্যবহারিক দিকনির্দেশনা, এবং বাস্তব চ্যালেঞ্জের মুখোমুখি বাস্তব পরিবারগুলির জন্য প্রমাণ-সূচিত অন্তর্দৃষ্টি।
