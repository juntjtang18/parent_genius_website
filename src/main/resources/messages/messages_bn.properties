membership.register.promise.body=আমরা বিশ্বাস করি অপ্রয়োজনীয় ব্যক্তিগত তথ্য না দিয়ে পিতামাতার বিশ্বস্ত শিক্ষাগত সহায়তার অ্যাক্সেস থাকা উচিত। এই কারণেই আমরা আপনার সদস্যতা পরিচালনা করতে, আপনার শেখার ব্যক্তিগতকরণ (যদি আপনি চয়ন করেন) এবং আপনার অ্যাকাউন্ট সুরক্ষিত রাখতে প্রয়োজনীয় ন্যূনতম তথ্য সংগ্রহ করি। আপনি কী ভাগ করেন তা আপনি নিয়ন্ত্রণ করেন এবং আপনি যে কোনো সময় ঐচ্ছিক তথ্য আপডেট করতে বা সরাতে পারেন।
