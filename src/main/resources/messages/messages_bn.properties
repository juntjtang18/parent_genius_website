joinus.title1=আমাদের সাথে যোগ দিন!
joinus.description=প্যারেন্ট জিনিয়াস এআই-তে, আমরা পিতৃত্ব সমর্থনের ভবিষ্যত তৈরি করছি।              আমরা উদ্ভাবন, স্বচ্ছতা এবং সহযোগিতাকে মূল্য দিই।              আমাদের দলের সাথে যোগ দিন এবং বিশ্বজুড়ে পরিবারগুলির জন্য একটি উজ্জ্বল ভবিষ্যত গঠনে সহায়তা করুন!
joinus.uiux.title=ইউআই/ইউএক্স ডিজাইনার
joinus.uiux.description1=আমরা একটি সৃজনশীল ইউআই/ইউএক্স ডিজাইনার খুঁজছি যিনি আমাদের প্ল্যাটফর্মের জন্য স্বজ্ঞাত এবং দৃষ্টিনন্দন ব্যবহারকারীর অভিজ্ঞতা তৈরি করতে পারেন।
joinus.uiux.description2=দায়িত্ব:
joinus.uiux.responsibility1=ওয়েব এবং মোবাইল অ্যাপ্লিকেশনের জন্য ব্যবহারকারী-বান্ধব ইন্টারফেস ডিজাইন এবং প্রোটোটাইপ করা।
joinus.uiux.responsibility2=ডেভেলপার এবং স্টেকহোল্ডারদের সাথে সহযোগিতা করে একটি নির্বিঘ্ন ব্যবহারকারীর অভিজ্ঞতা নিশ্চিত করা।
joinus.uiux.responsibility3=পণ্য ডিজাইন উন্নত করতে ব্যবহারকারী গবেষণা এবং ব্যবহারযোগ্যতা পরীক্ষার পরিচালনা করা।
joinus.uiux.requirements=প্রয়োজনীয়তা:
