pillars.hero.sub=বাচ্চাদের বোঝা। পিতামাতার ক্ষমতায়ন। পরিবারগুলোকে শক্তিশালী করা।
pillars.intro.title=প্রতিটি পিতামাতা তাদের সন্তানের জন্য খুব ভাল চান।
pillars.intro.p1=তবুও যখন আপনি চ্যালেঞ্জিং আচরণ, মানসিক উত্থান-পতন, স্কুলের উদ্বেগ, সামাজিক অসুবিধা বা আজকের প্রযুক্তির দ্বারা আনা দ্রুত পরিবর্তনগুলির মুখোমুখি হন তখন অভিভাবকত্ব অপ্রতিরোধ্য বোধ করতে পারে। দ্রুত উত্তর খোঁজা স্বাভাবিক-কিন্তু শিশুরা খুব কমই সহজ।
pillars.intro.p2=বেশিরভাগ প্যারেন্টিং সংস্থানগুলি একবারে একটি সমস্যা সমাধানের উপর ফোকাস করে: ক্ষুব্ধতা, উদ্বেগ, হোমওয়ার্ক, স্ক্রিন টাইম, ADHD, বন্ধুত্ব, বা মানসিক নিয়ন্ত্রণ।
pillars.intro.p3=কিন্তু শিশুরা বিচ্ছিন্ন শ্রেণীতে বেড়ে ওঠে না। একটি শিশুর আবেগ শেখার প্রভাবিত করে। সংবেদনশীল প্রক্রিয়াকরণ আচরণ প্রভাবিত করে। কার্যনির্বাহী কার্যকারিতা বন্ধুত্বকে প্রভাবিত করে। যোগাযোগ আত্মবিশ্বাসকে আকার দেয়। পারিবারিক রুটিন মানসিক সুস্থতাকে প্রভাবিত করে। উন্নয়নের প্রতিটি অংশ সংযুক্ত।
pillars.intro.p4=যখন আমরা শুধুমাত্র একটি চ্যালেঞ্জের উপর ফোকাস করি, তখন আমরা এটিকে চালিত করার অন্তর্নিহিত কারণগুলিকে উপেক্ষা করতে পারি। সেজন্য জিনিয়াসপ্যারেন্টিংএআই ভিন্নভাবে নির্মিত।
pillars.intro.mission_label=আমাদের মিশন সহজ:
pillars.intro.mission=বাচ্চাদের বোঝা। পিতামাতার ক্ষমতায়ন। পরিবারগুলোকে শক্তিশালী করা।
pillars.intro.mission_p1=আমরা বিশ্বাস করি যে পিতামাতারা যখন সত্যিই বুঝতে পারে যে তাদের সন্তানের বিকাশ কীভাবে একসাথে ফিট করে, তখন তারা আরও আত্মবিশ্বাসী সিদ্ধান্ত নিতে পারে, আরও বেশি সহানুভূতির সাথে প্রতিক্রিয়া জানাতে পারে এবং আরও শক্তিশালী, আরও সংযুক্ত পরিবার তৈরি করতে পারে।
pillars.intro.mission_p2=অভিভাবকত্বকে পৃথক বিষয়ের সংগ্রহ হিসাবে বিবেচনা করার পরিবর্তে, আমরা ছয়টি সংযুক্ত শেখার স্তম্ভের কাছাকাছি শেখার আয়োজন করি যা পিতামাতাদের পুরো সন্তানকে বুঝতে সাহায্য করে। প্রতিটি স্তম্ভ একটি ভিন্ন দৃষ্টিকোণ অফার করে এবং তারা একসাথে আপনার সন্তানের বৃদ্ধি, শক্তি এবং চ্যালেঞ্জগুলির একটি সম্পূর্ণ চিত্র তৈরি করে।
pillars.intro.puzzle=আপনার সন্তানের বিকাশকে একটি ধাঁধা হিসাবে ভাবুন। এক টুকরো আপনি যা দেখছেন তার কিছু অংশ ব্যাখ্যা করতে পারে, কিন্তু কোনো একক অংশ পুরো গল্পটি বলে না। যত বেশি টুকরো একত্রিত হয়, নিদর্শনগুলি আরও স্পষ্ট হয়, সমাধানগুলি আরও কার্যকর হয় এবং অভিভাবকত্ব আরও আত্মবিশ্বাসী হয়ে ওঠে।
pillars.intro.together=আমাদের শেখার স্তম্ভগুলি একসাথে কাজ করার জন্য ডিজাইন করা হয়েছে যাতে আপনি করতে পারেন:
pillars.check.1=কেন একটি আচরণ বা চ্যালেঞ্জ ঘটতে পারে বুঝতে.
pillars.check.2=উন্নয়নের বিভিন্ন ক্ষেত্র একে অপরকে কীভাবে প্রভাবিত করে তা স্বীকার করুন।
pillars.check.3=আপনার সন্তান এবং পরিবারের সাথে মানানসই ব্যবহারিক, প্রমাণ-অবহিত কৌশলগুলি শিখুন।
pillars.check.4=সম্পর্কিত বিষয়গুলি আবিষ্কার করুন যা অতিরিক্ত অন্তর্দৃষ্টি এবং সহায়তা প্রদান করতে পারে।
pillars.intro.close_title=আপনার শিশু বিকাশে বিশেষজ্ঞ হওয়ার দরকার নেই।
pillars.intro.close=আমরা সংযোগের মাধ্যমে আপনাকে গাইড করব, পরবর্তী শেখার পদক্ষেপগুলি সুপারিশ করব এবং আপনাকে একবারে এক ধাপে আত্মবিশ্বাস তৈরি করতে সাহায্য করব৷ লক্ষ্যটি কেবল আজকের সমস্যার সমাধান করা নয় - এটি আপনার সন্তানকে মানসিক, সামাজিক, একাডেমিকভাবে এবং দৈনন্দিন জীবনে উন্নতি করতে সহায়তা করা।
pillars.grid.title=আমাদের ছয়টি শেখার স্তম্ভ
pillars.grid.sub=একসাথে, আমাদের ছয়টি শিক্ষা স্তম্ভ একটি সংযুক্ত প্যারেন্টিং ইকোসিস্টেম তৈরি করে যা বিচ্ছিন্ন চ্যালেঞ্জের পরিবর্তে পুরো শিশুকে সমর্থন করে।
