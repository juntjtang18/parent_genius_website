about-hero-title=কেন পরিবার আমাদের বিশ্বাস.
about-hero-text=প্রতিটি পিতামাতার যাত্রা একটি প্রশ্ন দিয়ে শুরু হয়: "আমি কি প্রস্তুত? আমি কি এটি ঠিক করছি?" প্যারেন্টিং একটি ম্যানুয়াল সঙ্গে আসে না. এবং সেই অনুভূতিটি সর্বজনীন: সমর্থন, আশ্বাস এবং নির্দেশনার প্রয়োজন যা আসলে আপনার জীবনের সাথে খাপ খায়। আপনি একা এটা বের করতে হবে না.
about-care-title=আমাদের মূল বিশ্বাস
about-believe-cap5=জিনিয়াসপ্যারেন্টিংএআই পিতামাতাদের শক্তিশালী ভিত্তিগত জ্ঞান তৈরি করতে, সাধারণ সমস্যাগুলি এড়াতে এবং তাদের সন্তানদের দীর্ঘমেয়াদী মঙ্গলকে সমর্থন করে এমন চিন্তাশীল, অবহিত সিদ্ধান্ত নিতে সহায়তা করার জন্য বিদ্যমান।
about-believe-cap6=শিক্ষাগত দক্ষতা, প্রযুক্তিগত উদ্ভাবন, এবং বাস্তব-জীবনের অভিভাবকত্বের অন্তর্দৃষ্টিকে একত্রিত করে, আমাদের প্ল্যাটফর্মের লক্ষ্য পরিবার, শিক্ষাবিদ, অনুশীলনকারী এবং প্রতিষ্ঠানগুলিকে উপকৃত করা — পাশাপাশি বৃহত্তর শিশু এবং পারিবারিক সুস্থতা সম্প্রদায় জুড়ে গবেষণা, যোগাযোগ এবং সহযোগিতাকে সমর্থন করে৷
about-caption-50=আমাদের দৃষ্টি
about-caption-51=পিতামাতাদের জ্ঞান, সরঞ্জাম এবং সমর্থন দিয়ে ক্ষমতায়ন করার জন্য তাদের প্রয়োজন প্রেমময়, সহায়ক পরিবার তৈরি করতে যা বৃদ্ধিকে লালনপালন করে, স্থিতিস্থাপকতা বৃদ্ধি করে এবং পরবর্তী প্রজন্মকে আত্মবিশ্বাস, সমবেদনা এবং কৌতূহল নিয়ে উন্নতি করতে অনুপ্রাণিত করে।
about-caption-52=আমাদের মিশন
about-caption-53=আমাদের লক্ষ্য হল পিতামাতাদের কর্মযোগ্য অন্তর্দৃষ্টি, বিশেষজ্ঞের পরামর্শ এবং উদ্ভাবনী সংস্থান প্রদান করা, তাদের পুষ্টিকর পরিবেশ তৈরিতে সহায়তা করা যেখানে শিশুরা বেড়ে উঠতে পারে, উন্নতি করতে পারে এবং জীবনে সফল হওয়ার জন্য প্রয়োজনীয় দক্ষতা বিকাশ করতে পারে।
