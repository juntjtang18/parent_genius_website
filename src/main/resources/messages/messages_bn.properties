about-trust-1-text=আমাদের ফ্রেমওয়ার্কগুলি UBC শিক্ষাগত নেতৃত্ব, উপদেষ্টা বোর্ডের তদারকি এবং EdTech সহযোগীদের দ্বারা বিকশিত এবং নির্দেশিত হয় — তাই নির্দেশিকা বাস্তব শিক্ষার অনুশীলনের উপর ভিত্তি করে থাকে।
about-trust-2-title=প্রযুক্তিগত ট্রাস্ট
about-trust-2-text=AI এলোমেলো ফোরামের পরিবর্তে বিশেষজ্ঞ-পরীক্ষিত শিক্ষামূলক কাঠামোর উপর প্রশিক্ষিত হয়, যার অর্থ কম হ্যালুসিনেশন এবং সমর্থন যা দায়ী থাকে।
about-trust-3-title=ব্যবহারিক ট্রাস্ট
about-trust-3-text=উপদেশ বাস্তব অভিভাবকত্বের চ্যালেঞ্জ এবং দৈনন্দিন পারিবারিক জীবন দ্বারা আকৃতি ধারণ করে, তাই এটি 3AM-এ দরকারী - শুধুমাত্র তাত্ত্বিক নয়।
