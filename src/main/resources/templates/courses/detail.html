<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link th:href="@{/css/style.css}" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet"/>
    <style>
        .course-detail-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding-top: 6.5rem;
            padding-bottom: 3rem;
        }
        .course-back-link {
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
        }
        .course-title {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            font-family: "Poppins", sans-serif;
            font-size: clamp(1.6rem, 2.8vw, 2.2rem);
            line-height: 1.2;
            font-weight: 800;
            color: #0f172a;
        }
        .course-top-image {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 1.2rem;
            object-fit: cover;
            max-height: 360px;
            background: #f1f5f9;
        }
        .membership-lock {
            border: 1px solid #dbeafe;
            border-radius: 12px;
            background: #f8fbff;
            padding: 1.25rem;
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 1rem;
        }
        .membership-lock h2 {
            font-family: "Poppins", sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .membership-lock p {
            margin-bottom: 1rem;
        }
        .membership-lock .btn {
            font-weight: 600;
            border-radius: 999px;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .course-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .content-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.55;
            margin: 0;
        }
        .content-image {
            width: 100%;
            border-radius: 10px;
            object-fit: contain;
            background: #f8fafc;
            max-height: 520px;
        }
        .content-caption {
            margin-top: 0.4rem;
            margin-bottom: 0;
            text-align: center;
            font-style: italic;
            color: #64748b;
            font-size: 0.92rem;
        }
        .content-video, .content-iframe {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #000;
            min-height: 240px;
        }
        .content-iframe-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        .content-iframe-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .quiz-card {
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 1rem;
            background: #f8fbff;
        }
        .quiz-question {
            margin-bottom: 0.6rem;
            font-weight: 700;
            color: #1e3a8a;
        }
        .quiz-option {
            margin: 0.2rem 0;
            color: #334155;
        }
        .course-state {
            text-align: center;
            color: #64748b;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container course-detail-wrap">
    <a id="course-back-link" href="/courses/foundation" class="course-back-link"><i class="fa-solid fa-arrow-left"></i> Back to courses</a>
    <h1 id="course-title" class="course-title">Loading...</h1>

    <div id="course-loading" class="course-state">
        <div class="spinner-border text-primary mb-2" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div>Loading course...</div>
    </div>
    <div id="course-error" class="course-state d-none"></div>
    <section id="membership-lock" class="membership-lock d-none">
        <h2>Membership Required</h2>
        <p>This course is available with Membership.</p>
        <a id="membership-cta" href="/membership" class="btn btn-primary">View Membership</a>
    </section>
    <img id="course-top-image" class="course-top-image d-none" alt="Course cover"/>
    <section id="course-content" class="course-content d-none"></section>

    <div id="course-config"
         class="d-none"
         th:attr="data-course-id=${courseId},
                  data-strapi-api-url=${strapiApiUrl},
                  data-strapi-token=${strapiToken},
                  data-strapi-root-url=${strapiRootUrl},
                  data-locale=${#locale}"></div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const cfgEl = document.getElementById('course-config');
    const cfg = cfgEl ? cfgEl.dataset : {};
    const courseId = Number(cfg.courseId || 0);
    const strapiApiUrl = (cfg.strapiApiUrl || '').replace(/\/+$/, '');
    const strapiToken = cfg.strapiToken || '';
    const strapiRootUrl = (cfg.strapiRootUrl || '').replace(/\/+$/, '');
    const locale = (cfg.locale || 'en').toString().replace('_', '-');
    let hasPaidPlan = false;

    const loadingEl = document.getElementById('course-loading');
    const errorEl = document.getElementById('course-error');
    const contentEl = document.getElementById('course-content');
    const titleEl = document.getElementById('course-title');
    const topImageEl = document.getElementById('course-top-image');
    const lockEl = document.getElementById('membership-lock');
    const backLinkEl = document.getElementById('course-back-link');
    const membershipCtaEl = document.getElementById('membership-cta');

    function authHeaders() {
        return strapiToken ? { Authorization: strapiToken } : {};
    }

    function fullAssetUrl(path) {
        if (!path) return '';
        if (path.startsWith('http://') || path.startsWith('https://')) return path;
        return strapiRootUrl + (path.startsWith('/') ? path : '/' + path);
    }

    function setError(message) {
        loadingEl.classList.add('d-none');
        contentEl.classList.add('d-none');
        lockEl.classList.add('d-none');
        errorEl.textContent = message;
        errorEl.classList.remove('d-none');
    }

    function getFromCategory() {
        const fromCategory = new URLSearchParams(window.location.search).get('fromCategory') || 'foundation';
        if (fromCategory === 'membership-only' || fromCategory === 'parenting-tools' || fromCategory === 'foundation') {
            return fromCategory;
        }
        return 'foundation';
    }

    function isMembershipOnly(course) {
        const categoryName = (
            course?.attributes?.coursecategory?.data?.attributes?.name ||
            ''
        ).toLowerCase().trim();
        return (
            categoryName === 'membership only' ||
            categoryName.includes('membership') ||
            categoryName.includes('member') ||
            categoryName.includes('会员')
        );
    }

    function getEntitlement(source, key) {
        const list = Array.isArray(source) ? source : (source && Array.isArray(source.entitlements) ? source.entitlements : []);
        return list.find((entitlement) => entitlement && entitlement.key === key) || null;
    }

    function isEntitlementValueEnabled(value) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'number') return value > 0;
        if (typeof value === 'string') return value.length > 0 && value.toLowerCase() !== 'false';
        return false;
    }

    function hasEntitlement(source, key) {
        const entitlement = getEntitlement(source, key);
        return isEntitlementValueEnabled(entitlement ? entitlement.value : undefined);
    }

    async function loadEntitlements() {
        try {
            const response = await fetch('/api/subscription/entitlements', {
                credentials: 'same-origin'
            });
            if (!response.ok) return null;
            return await response.json();
        } catch (e) {
            return null;
        }
    }

    function escapeHtml(raw) {
        return String(raw || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function extractLocalizedTitle(courseData) {
        const base = courseData?.attributes?.title || 'Untitled';
        const locs = courseData?.attributes?.localizations?.data || [];
        const norm = locale.toLowerCase();
        const match = locs.find((x) => {
            const l = (x?.attributes?.locale || '').toLowerCase();
            return l === norm || l === norm.split('-')[0];
        });
        return match?.attributes?.title || base;
    }

    function toEmbedUrl(url) {
        if (!url) return '';
        const patterns = [
            /v=([a-zA-Z0-9_-]{11})/,
            /youtu\.be\/([a-zA-Z0-9_-]{11})/,
            /embed\/([a-zA-Z0-9_-]{11})/,
            /shorts\/([a-zA-Z0-9_-]{11})/
        ];
        for (const p of patterns) {
            const m = url.match(p);
            if (m && m[1]) {
                return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?playsinline=1&controls=1&rel=0';
            }
        }
        if (url.includes('/embed/')) return url;
        return '';
    }

    function textAlignFrom(style) {
        const align = style?.textAlign;
        return ['left', 'center', 'right', 'justify'].includes(align) ? align : 'left';
    }

    function renderTextComponent(item) {
        const p = document.createElement('p');
        p.className = 'content-text';
        const style = item.style || item.styles || {};
        p.textContent = item.data || '';
        p.style.fontSize = ((style.fontSize || 17) + 'px');
        p.style.color = style.fontColor || '#0f172a';
        p.style.fontWeight = style.isBold ? '700' : '400';
        p.style.fontStyle = style.isItalic ? 'italic' : 'normal';
        p.style.textAlign = textAlignFrom(style);
        contentEl.appendChild(p);
    }

    function renderImageComponent(item) {
        const imgUrl = item?.image_file?.data?.attributes?.url;
        if (!imgUrl) return;
        const block = document.createElement('div');
        const img = document.createElement('img');
        img.className = 'content-image';
        img.loading = 'lazy';
        img.src = fullAssetUrl(imgUrl);
        img.alt = 'Course image';
        block.appendChild(img);
        const caption = item?.image_file?.data?.attributes?.caption;
        if (caption) {
            const p = document.createElement('p');
            p.className = 'content-caption';
            p.textContent = caption;
            block.appendChild(p);
        }
        contentEl.appendChild(block);
    }

    function renderHostedVideoComponent(item) {
        const videoUrl = item?.video_file?.data?.attributes?.url;
        if (!videoUrl) return;
        const block = document.createElement('div');
        const v = document.createElement('video');
        v.className = 'content-video';
        v.controls = true;
        v.preload = 'metadata';
        v.src = fullAssetUrl(videoUrl);
        const poster = item?.thumbnail?.data?.attributes?.url;
        if (poster) {
            v.poster = fullAssetUrl(poster);
        }
        block.appendChild(v);
        const caption = item?.video_file?.data?.attributes?.caption || item?.caption;
        if (caption) {
            const p = document.createElement('p');
            p.className = 'content-caption';
            p.textContent = caption;
            block.appendChild(p);
        }
        contentEl.appendChild(block);
    }

    function renderExternalVideoComponent(item) {
        const embed = toEmbedUrl(item?.external_url || '');
        if (!embed) return;
        const wrap = document.createElement('div');
        wrap.className = 'content-iframe-wrap';
        const iframe = document.createElement('iframe');
        iframe.className = 'content-iframe';
        iframe.allowFullscreen = true;
        iframe.src = embed;
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        wrap.appendChild(iframe);
        contentEl.appendChild(wrap);
        if (item.caption) {
            const p = document.createElement('p');
            p.className = 'content-caption';
            p.textContent = item.caption;
            contentEl.appendChild(p);
        }
    }

    function renderQuizComponent(item) {
        const q = item?.question;
        if (!q) return;
        const options = Array.isArray(item.options) ? item.options : [];
        const block = document.createElement('div');
        block.className = 'quiz-card';
        block.innerHTML = '<div class="quiz-question">' + escapeHtml(q) + '</div>';
        options.forEach((opt) => {
            const p = document.createElement('p');
            p.className = 'quiz-option';
            p.textContent = '• ' + opt;
            block.appendChild(p);
        });
        contentEl.appendChild(block);
    }

    function renderContent(items) {
        contentEl.innerHTML = '';
        items.forEach((item) => {
            switch (item.__component) {
                case 'coursecontent.text':
                    renderTextComponent(item);
                    break;
                case 'coursecontent.image':
                    renderImageComponent(item);
                    break;
                case 'coursecontent.video':
                    renderHostedVideoComponent(item);
                    break;
                case 'coursecontent.external-video':
                    renderExternalVideoComponent(item);
                    break;
                case 'coursecontent.quiz':
                    renderQuizComponent(item);
                    break;
                case 'coursecontent.pagebreaker':
                    break;
                default:
                    break;
            }
        });
    }

    async function loadCourse() {
        if (!courseId) {
            setError('Invalid course ID.');
            return;
        }
        try {
            const entitlements = await loadEntitlements();
            hasPaidPlan = hasEntitlement(entitlements, 'courses.premium');

            const params = new URLSearchParams();
            params.set('populate[content][populate]', 'image_file,video_file,thumbnail');
            params.set('populate[icon_image][populate]', 'formats');
            params.set('populate[coursecategory][populate]', '*');
            params.set('populate[localizations][fields][0]', 'title');
            params.set('populate[localizations][fields][1]', 'locale');
            params.set('locale', 'en');
            params.set('populate[localizations][filters][locale][$eq]', locale);

            params.set('filters[id][$eq]', String(courseId));

            const res = await fetch(strapiApiUrl + '/courses?' + params.toString(), {
                headers: authHeaders()
            });
            if (!res.ok) throw new Error('Failed to load course (' + res.status + ')');
            const body = await res.json();
            const course = Array.isArray(body?.data) ? body.data[0] : null;
            if (!course?.attributes) throw new Error('Course not found.');
            const fromCategory = getFromCategory();
            backLinkEl.href = '/courses/' + fromCategory;
            membershipCtaEl.href = '/membership?fromCourse=' + encodeURIComponent('/courses/' + courseId + '?fromCategory=' + fromCategory);
            titleEl.textContent = extractLocalizedTitle(course);

            if (isMembershipOnly(course) && !hasPaidPlan) {
                loadingEl.classList.add('d-none');
                contentEl.classList.add('d-none');
                topImageEl.classList.add('d-none');
                lockEl.classList.remove('d-none');
                return;
            }

            const cover = course.attributes.icon_image?.data?.attributes;
            const coverUrl = cover?.formats?.large?.url || cover?.formats?.medium?.url || cover?.url || '';
            if (coverUrl) {
                topImageEl.src = fullAssetUrl(coverUrl);
                topImageEl.classList.remove('d-none');
            }

            renderContent(course.attributes.content || []);
            loadingEl.classList.add('d-none');
            lockEl.classList.add('d-none');
            contentEl.classList.remove('d-none');
        } catch (e) {
            console.error(e);
            setError('Could not load course details.');
        }
    }

    document.addEventListener('DOMContentLoaded', loadCourse);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
