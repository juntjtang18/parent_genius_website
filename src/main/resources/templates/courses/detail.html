<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
          crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;800&display=swap" rel="stylesheet"/>
    <style>
        .course-detail-wrap {
            max-width: 900px;
            margin: 0 auto;
            padding-top: 6.5rem;
            padding-bottom: 3rem;
        }
        .course-back-link {
            font-family: "Poppins", sans-serif;
            font-weight: 600;
            color: #2563eb;
            text-decoration: none;
        }
        .course-title {
            margin-top: 1rem;
            margin-bottom: 1.5rem;
            font-family: "Poppins", sans-serif;
            font-size: clamp(1.6rem, 2.8vw, 2.2rem);
            line-height: 1.2;
            font-weight: 800;
            color: #0f172a;
        }
        .course-top-image {
            width: 100%;
            border-radius: 14px;
            margin-bottom: 1.2rem;
            object-fit: cover;
            max-height: 360px;
            background: #f1f5f9;
        }
        .membership-lock {
            border: 1px solid #dbeafe;
            border-radius: 12px;
            background: #f8fbff;
            padding: 1.25rem;
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 1rem;
        }
        .membership-lock h2 {
            font-family: "Poppins", sans-serif;
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }
        .membership-lock p {
            margin-bottom: 1rem;
        }
        .membership-lock .btn {
            font-weight: 600;
            border-radius: 999px;
            padding-left: 1rem;
            padding-right: 1rem;
        }
        .course-content {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .course-page-frame {
            border: 1px solid #dbeafe;
            border-radius: 16px;
            background: #ffffff;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
            overflow: hidden;
        }
        .course-page-frame .course-content {
            min-height: 240px;
            padding: 1.25rem;
        }
        .course-pager,
        .course-pager-pages {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.45rem;
        }
        .course-pager {
            border-top: 1px solid #dbeafe;
            padding: 0.85rem 1rem;
            background: #ffffff;
        }
        .course-pager-arrow,
        .course-pager-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 28px;
            height: 28px;
            padding: 0 4px;
            border: 0;
            background: transparent;
            color: #4B5563;
            font-family: "Poppins", sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            line-height: 1;
        }
        .course-pager-arrow {
            color: #6B7280;
            font-size: 0.85rem;
        }
        .course-pager-arrow:disabled {
            color: #D1D5DB;
            pointer-events: none;
        }
        .course-pager-number.is-active {
            min-width: 30px;
            height: 30px;
            border-radius: 8px;
            background: #3D91FD;
            color: #ffffff;
            font-weight: 400;
        }
        .course-pager-ellipsis {
            color: #4B5563;
            font-family: "Poppins", sans-serif;
            font-size: 0.92rem;
            font-weight: 400;
            padding: 0 2px;
        }
        .course-pager-arrow:focus-visible,
        .course-pager-number:focus-visible {
            outline: 3px solid rgba(61, 145, 253, 0.3);
            outline-offset: 2px;
        }
        .content-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 1.55;
            margin: 0;
        }
        .content-text-block {
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .content-speech-button {
            align-self: flex-end;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 999px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 1.15rem;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }
        .content-speech-button:hover {
            background: #dbeafe;
            transform: scale(1.05);
        }
        .content-speech-button.is-speaking {
            background: #2563eb;
            color: #ffffff;
        }
        .content-speech-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.3);
            outline-offset: 2px;
        }
        .content-image {
            width: 100%;
            border-radius: 10px;
            object-fit: contain;
            background: #f8fafc;
            max-height: 520px;
        }
        .content-caption {
            margin-top: 0.4rem;
            margin-bottom: 0;
            text-align: center;
            font-style: italic;
            color: #64748b;
            font-size: 0.92rem;
        }
        .content-attachments {
            margin: 0.75rem 0;
            display: flex;
            flex-direction: column;
            gap: 0.65rem;
        }
        .content-attachments-title {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 800;
            color: #0f172a;
        }
        .content-attachments-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .content-attachment-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.7rem 0.85rem;
            border: 1px solid #dbeafe;
            border-radius: 12px;
            background: #f8fbff;
        }
        .content-attachment-name {
            color: #0f172a;
            font-weight: 600;
            word-break: break-word;
        }
        .content-download-button {
            flex-shrink: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border: 0;
            border-radius: 999px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 1.05rem;
            text-decoration: none;
            transition: background-color 0.15s ease, color 0.15s ease, transform 0.15s ease;
        }
        .content-download-button:hover {
            background: #2563eb;
            color: #ffffff;
            transform: scale(1.05);
        }
        .content-download-button:focus-visible {
            outline: 3px solid rgba(37, 99, 235, 0.3);
            outline-offset: 2px;
        }
        .content-video, .content-iframe {
            width: 100%;
            border: 0;
            border-radius: 10px;
            background: #000;
            min-height: 240px;
        }
        .content-iframe-wrap {
            position: relative;
            width: 100%;
            padding-top: 56.25%;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
        }
        .content-iframe-wrap iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        .quiz-card {
            border: 1px solid #dbeafe;
            border-radius: 12px;
            padding: 1rem;
            background: #f8fbff;
        }
        .quiz-question {
            margin-bottom: 0.6rem;
            font-weight: 700;
            color: #1e3a8a;
        }
        .quiz-option {
            margin: 0.2rem 0;
            color: #334155;
        }
        .course-state {
            text-align: center;
            color: #64748b;
            padding: 2rem 0;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container course-detail-wrap">
    <a id="course-back-link" href="/courses/foundation" class="course-back-link"><i class="fa-solid fa-arrow-left"></i> Back to courses</a>
    <h1 id="course-title" class="course-title">Loading...</h1>

    <div id="course-loading" class="course-state">
        <div class="spinner-border text-primary mb-2" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
        <div>Loading course...</div>
    </div>
    <div id="course-error" class="course-state d-none"></div>
    <section id="membership-lock" class="membership-lock d-none">
        <h2>Membership Required</h2>
        <p>This course is available with Membership.</p>
        <a id="membership-cta" href="/membership" class="btn btn-primary">View Membership</a>
    </section>
    <img id="course-top-image" class="course-top-image d-none" alt="Course cover"/>
    <div id="course-page-frame" class="course-page-frame d-none">
        <section id="course-content" class="course-content"></section>
        <div id="course-empty" class="course-state d-none"></div>
        <nav id="course-pager" class="course-pager" aria-label="Course pages">
            <button id="course-previous-page" class="course-pager-arrow" type="button">
                <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
            </button>
            <div id="course-pager-pages" class="course-pager-pages"></div>
            <button id="course-next-page" class="course-pager-arrow" type="button">
                <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
            </button>
        </nav>
    </div>

    <div id="course-config"
         class="d-none"
         th:attr="data-course-id=${courseId},
                  data-strapi-api-url=${strapiApiUrl},
                  data-strapi-token=${strapiToken},
                  data-strapi-root-url=${strapiRootUrl},
                  data-previous-page-label=#{course.detail.previous_page},
                  data-next-page-label=#{course.detail.next_page},
                  data-no-content-message=#{course.detail.no_content},
                  data-read-aloud-label=#{course.detail.read_aloud},
                  data-stop-reading-label=#{course.detail.stop_reading},
                  data-speech-unsupported-message=#{course.detail.speech_unsupported},
                  data-locale=${#locale}"></div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
    const cfgEl = document.getElementById('course-config');
    const cfg = cfgEl ? cfgEl.dataset : {};
    const courseId = Number(cfg.courseId || 0);
    const strapiApiUrl = (cfg.strapiApiUrl || '').replace(/\/+$/, '');
    const strapiToken = cfg.strapiToken || '';
    const strapiRootUrl = (cfg.strapiRootUrl || '').replace(/\/+$/, '');
    const locale = (cfg.locale || 'en').toString().replace('_', '-');
    const previousPageLabel = cfg.previousPageLabel || 'Previous page';
    const nextPageLabel = cfg.nextPageLabel || 'Next page';
    const noContentMessage = cfg.noContentMessage || 'No content for this course.';
    const readAloudLabel = cfg.readAloudLabel || 'Read text aloud';
    const stopReadingLabel = cfg.stopReadingLabel || 'Stop reading';
    const speechUnsupportedMessage = cfg.speechUnsupportedMessage || 'Text-to-speech is not supported by this browser.';
    const speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    let hasPaidPlan = false;
    let courseContent = [];
    let coursePages = [];
    let currentPageIndex = 0;
    let activeSpeechButton = null;
    let activeUtterance = null;

    const loadingEl = document.getElementById('course-loading');
    const errorEl = document.getElementById('course-error');
    const pageFrameEl = document.getElementById('course-page-frame');
    const contentEl = document.getElementById('course-content');
    const emptyEl = document.getElementById('course-empty');
    const pagerEl = document.getElementById('course-pager');
    const previousPageEl = document.getElementById('course-previous-page');
    const nextPageEl = document.getElementById('course-next-page');
    const pagerPagesEl = document.getElementById('course-pager-pages');
    const titleEl = document.getElementById('course-title');
    const topImageEl = document.getElementById('course-top-image');
    const lockEl = document.getElementById('membership-lock');
    const backLinkEl = document.getElementById('course-back-link');
    const membershipCtaEl = document.getElementById('membership-cta');

    previousPageEl.setAttribute('aria-label', previousPageLabel);
    nextPageEl.setAttribute('aria-label', nextPageLabel);

    function authHeaders() {
        return strapiToken ? { Authorization: strapiToken } : {};
    }

    function fullAssetUrl(path) {
        if (!path) return '';
        if (path.startsWith('http://') || path.startsWith('https://')) return path;
        return strapiRootUrl + (path.startsWith('/') ? path : '/' + path);
    }

    function setError(message) {
        loadingEl.classList.add('d-none');
        pageFrameEl.classList.add('d-none');
        lockEl.classList.add('d-none');
        errorEl.textContent = message;
        errorEl.classList.remove('d-none');
    }

    function getFromCategory() {
        const fromCategory = new URLSearchParams(window.location.search).get('fromCategory') || 'foundation';
        if (fromCategory === 'membership-only' || fromCategory === 'parenting-tools' || fromCategory === 'foundation') {
            return fromCategory;
        }
        return 'foundation';
    }

    function getBackHref(course) {
        const params = new URLSearchParams(window.location.search);
        const fromPillar = params.get('fromPillar');
        if (fromPillar && /^\d+$/.test(fromPillar)) {
            return '/courses/pillar/' + fromPillar;
        }
        const fromCategory = params.get('fromCategory');
        if (fromCategory === 'membership-only' || fromCategory === 'parenting-tools' || fromCategory === 'foundation') {
            return '/courses/' + fromCategory;
        }
        const pillarId = course?.attributes?.pillar?.data?.id;
        if (pillarId) {
            return '/courses/pillar/' + pillarId;
        }
        return '/courses/' + getFromCategory();
    }

    function isMembershipOnly(course) {
        const categoryName = (
            course?.attributes?.coursecategory?.data?.attributes?.name ||
            ''
        ).toLowerCase().trim();
        return (
            categoryName === 'membership only' ||
            categoryName.includes('membership') ||
            categoryName.includes('member') ||
            categoryName.includes('会员')
        );
    }

    function getEntitlement(source, key) {
        const list = Array.isArray(source) ? source : (source && Array.isArray(source.entitlements) ? source.entitlements : []);
        return list.find((entitlement) => entitlement && entitlement.key === key) || null;
    }

    function isEntitlementValueEnabled(value) {
        if (typeof value === 'boolean') return value;
        if (typeof value === 'number') return value > 0;
        if (typeof value === 'string') return value.length > 0 && value.toLowerCase() !== 'false';
        return false;
    }

    function hasEntitlement(source, key) {
        const entitlement = getEntitlement(source, key);
        return isEntitlementValueEnabled(entitlement ? entitlement.value : undefined);
    }

    async function loadEntitlements() {
        try {
            const response = await fetch('/api/subscription/entitlements', {
                credentials: 'same-origin'
            });
            if (!response.ok) return null;
            return await response.json();
        } catch (e) {
            return null;
        }
    }

    function escapeHtml(raw) {
        return String(raw || '')
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function extractLocalizedTitle(courseData) {
        const base = courseData?.attributes?.title || 'Untitled';
        const locs = courseData?.attributes?.localizations?.data || [];
        const norm = locale.toLowerCase();
        const match = locs.find((x) => {
            const l = (x?.attributes?.locale || '').toLowerCase();
            return l === norm || l === norm.split('-')[0];
        });
        return match?.attributes?.title || base;
    }

    function toEmbedUrl(url) {
        if (!url) return '';
        const patterns = [
            /v=([a-zA-Z0-9_-]{11})/,
            /youtu\.be\/([a-zA-Z0-9_-]{11})/,
            /embed\/([a-zA-Z0-9_-]{11})/,
            /shorts\/([a-zA-Z0-9_-]{11})/
        ];
        for (const p of patterns) {
            const m = url.match(p);
            if (m && m[1]) {
                return 'https://www.youtube-nocookie.com/embed/' + m[1] + '?playsinline=1&controls=1&rel=0';
            }
        }
        if (url.includes('/embed/')) return url;
        return '';
    }

    function textAlignFrom(style) {
        const align = style?.textAlign;
        return ['left', 'center', 'right', 'justify'].includes(align) ? align : 'left';
    }

    function getSpeechLanguage() {
        const language = locale.toLowerCase().split('-')[0];
        const languageMap = {
            bn: 'bn-BD',
            de: 'de-DE',
            en: 'en-US',
            es: 'es-ES',
            fr: 'fr-FR',
            hi: 'hi-IN',
            ja: 'ja-JP',
            ko: 'ko-KR',
            si: 'si-LK',
            zh: 'zh-CN'
        };
        return languageMap[language] || locale || 'en-US';
    }

    function setSpeechButtonState(button, isSpeaking) {
        if (!button) return;
        const label = isSpeaking ? stopReadingLabel : readAloudLabel;
        button.classList.toggle('is-speaking', isSpeaking);
        button.setAttribute('aria-label', label);
        button.setAttribute('title', label);
        button.innerHTML = isSpeaking
            ? '<i class="fa-solid fa-circle-stop" aria-hidden="true"></i>'
            : '<i class="fa-solid fa-volume-high" aria-hidden="true"></i>';
    }

    function stopSpeech() {
        const button = activeSpeechButton;
        activeSpeechButton = null;
        activeUtterance = null;
        if (speechSupported) {
            window.speechSynthesis.cancel();
        }
        setSpeechButtonState(button, false);
    }

    function finishSpeech(utterance) {
        if (activeUtterance !== utterance) return;
        const button = activeSpeechButton;
        activeSpeechButton = null;
        activeUtterance = null;
        setSpeechButtonState(button, false);
    }

    function toggleSpeech(button, text) {
        if (!speechSupported) {
            window.alert(speechUnsupportedMessage);
            return;
        }
        if (activeSpeechButton === button) {
            stopSpeech();
            return;
        }

        stopSpeech();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = getSpeechLanguage();
        utterance.rate = 1;
        utterance.onend = () => finishSpeech(utterance);
        utterance.onerror = () => finishSpeech(utterance);
        activeSpeechButton = button;
        activeUtterance = utterance;
        setSpeechButtonState(button, true);
        window.speechSynthesis.speak(utterance);
    }

    function renderTextComponent(item) {
        const text = item.data || '';
        if (!text) return;
        const block = document.createElement('div');
        block.className = 'content-text-block';
        const p = document.createElement('p');
        p.className = 'content-text';
        const style = item.style || item.styles || {};
        p.textContent = text;
        p.style.fontSize = ((style.fontSize || 17) + 'px');
        p.style.color = style.fontColor || '#0f172a';
        p.style.fontWeight = style.isBold ? '700' : '400';
        p.style.fontStyle = style.isItalic ? 'italic' : 'normal';
        p.style.textAlign = textAlignFrom(style);
        block.appendChild(p);

        const speechButton = document.createElement('button');
        speechButton.className = 'content-speech-button';
        speechButton.type = 'button';
        setSpeechButtonState(speechButton, false);
        speechButton.addEventListener('click', () => toggleSpeech(speechButton, text));
        block.appendChild(speechButton);
        contentEl.appendChild(block);
    }

    function renderImageComponent(item) {
        const imgUrl = item?.image_file?.data?.attributes?.url;
        if (!imgUrl) return;
        const block = document.createElement('div');
        const img = document.createElement('img');
        img.className = 'content-image';
        img.loading = 'lazy';
        img.src = fullAssetUrl(imgUrl);
        img.alt = 'Course image';
        block.appendChild(img);
        const caption = item?.image_file?.data?.attributes?.caption;
        if (caption) {
            const p = document.createElement('p');
            p.className = 'content-caption';
            p.textContent = caption;
            block.appendChild(p);
        }
        contentEl.appendChild(block);
    }

    function renderHostedVideoComponent(item) {
        const videoUrl = item?.video_file?.data?.attributes?.url;
        if (!videoUrl) return;
        const block = document.createElement('div');
        const v = document.createElement('video');
        v.className = 'content-video';
        v.controls = true;
        v.preload = 'metadata';
        v.src = fullAssetUrl(videoUrl);
        const poster = item?.thumbnail?.data?.attributes?.url;
        if (poster) {
            v.poster = fullAssetUrl(poster);
        }
        block.appendChild(v);
        const caption = item?.video_file?.data?.attributes?.caption || item?.caption;
        if (caption) {
            const p = document.createElement('p');
            p.className = 'content-caption';
            p.textContent = caption;
            block.appendChild(p);
        }
        contentEl.appendChild(block);
    }

    function renderExternalVideoComponent(item) {
        const embed = toEmbedUrl(item?.external_url || '');
        if (!embed) return;
        const wrap = document.createElement('div');
        wrap.className = 'content-iframe-wrap';
        const iframe = document.createElement('iframe');
        iframe.className = 'content-iframe';
        iframe.allowFullscreen = true;
        iframe.src = embed;
        iframe.referrerPolicy = 'strict-origin-when-cross-origin';
        iframe.setAttribute('allow', 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share');
        wrap.appendChild(iframe);
        contentEl.appendChild(wrap);
        if (item.caption) {
            const p = document.createElement('p');
            p.className = 'content-caption';
            p.textContent = item.caption;
            contentEl.appendChild(p);
        }
    }

    function renderQuizComponent(item) {
        const q = item?.question;
        if (!q) return;
        const options = Array.isArray(item.options) ? item.options : [];
        const block = document.createElement('div');
        block.className = 'quiz-card';
        block.innerHTML = '<div class="quiz-question">' + escapeHtml(q) + '</div>';
        options.forEach((opt) => {
            const p = document.createElement('p');
            p.className = 'quiz-option';
            p.textContent = '• ' + opt;
            block.appendChild(p);
        });
        contentEl.appendChild(block);
    }

    function attachmentFilesFromItem(item) {
        const files = item?.files;
        const raw = Array.isArray(files) ? files : (files?.data ? files.data : (files ? [files] : []));
        const list = Array.isArray(raw) ? raw : [];
        return list.map((file) => ({
            id: file.id,
            name: file.name || file.attributes?.name || 'Download',
            url: file.url || file.attributes?.url || ''
        })).filter((file) => file.url);
    }

    function renderAttachmentsComponent(item) {
        const files = attachmentFilesFromItem(item);
        if (!item.title && !files.length) return;

        const block = document.createElement('div');
        block.className = 'content-attachments';
        if (item.title) {
            const heading = document.createElement('p');
            heading.className = 'content-attachments-title';
            heading.textContent = item.title;
            block.appendChild(heading);
        }

        const list = document.createElement('ul');
        list.className = 'content-attachments-list';
        files.forEach((file) => {
            const li = document.createElement('li');
            li.className = 'content-attachment-row';

            const name = document.createElement('span');
            name.className = 'content-attachment-name';
            name.textContent = file.name;

            const download = document.createElement('a');
            download.className = 'content-download-button';
            download.href = fullAssetUrl(file.url);
            download.setAttribute('download', file.name);
            download.target = '_blank';
            download.rel = 'noopener noreferrer';
            download.setAttribute('aria-label', 'Download ' + file.name);
            download.innerHTML = '<i class="fa-solid fa-download" aria-hidden="true"></i>';

            li.appendChild(name);
            li.appendChild(download);
            list.appendChild(li);
        });
        if (list.childElementCount) {
            block.appendChild(list);
        }
        contentEl.appendChild(block);
    }

    function renderContent(items) {
        contentEl.innerHTML = '';
        items.forEach((item) => {
            switch (item.__component) {
                case 'coursecontent.text':
                    renderTextComponent(item);
                    break;
                case 'coursecontent.image':
                    renderImageComponent(item);
                    break;
                case 'coursecontent.video':
                    renderHostedVideoComponent(item);
                    break;
                case 'coursecontent.external-video':
                    renderExternalVideoComponent(item);
                    break;
                case 'coursecontent.quiz':
                    renderQuizComponent(item);
                    break;
                case 'coursecontent.attachments':
                    renderAttachmentsComponent(item);
                    break;
                case 'coursecontent.pagebreaker':
                    break;
                default:
                    break;
            }
        });
    }

    function groupContentIntoPages(items) {
        const pages = [];
        let currentPage = [];

        items.forEach((item) => {
            if (item.__component === 'coursecontent.pagebreaker') {
                if (currentPage.length) {
                    pages.push(currentPage);
                }
                currentPage = [];
            } else {
                currentPage.push(item);
            }
        });

        if (currentPage.length) {
            pages.push(currentPage);
        }
        if (!pages.length && items.length) {
            pages.push(items.filter((item) => item.__component !== 'coursecontent.pagebreaker'));
        }
        return pages;
    }

    function pageBreakerAt(targetIndex) {
        let pageCounter = 0;
        for (const item of courseContent) {
            if (item.__component !== 'coursecontent.pagebreaker') continue;
            if (pageCounter === targetIndex) return item;
            pageCounter += 1;
        }
        return null;
    }

    function getPageSettings() {
        let showPrevious = currentPageIndex > 0;
        let showNext = currentPageIndex < coursePages.length - 1;

        if (showPrevious) {
            const breaker = pageBreakerAt(currentPageIndex - 1);
            showPrevious = breaker?.backbutton ?? true;
        }
        if (showNext) {
            const breaker = pageBreakerAt(currentPageIndex);
            showNext = breaker?.nextbutton ?? true;
        }
        return { showPrevious, showNext };
    }

    function renderCurrentPage(shouldScroll) {
        stopSpeech();
        if (!coursePages.length) {
            contentEl.innerHTML = '';
            contentEl.classList.add('d-none');
            emptyEl.textContent = noContentMessage;
            emptyEl.classList.remove('d-none');
            pagerEl.classList.add('d-none');
            return;
        }

        contentEl.classList.remove('d-none');
        emptyEl.classList.add('d-none');
        pagerEl.classList.remove('d-none');
        renderContent(coursePages[currentPageIndex] || []);

        const settings = getPageSettings();
        previousPageEl.disabled = !settings.showPrevious;
        nextPageEl.disabled = !settings.showNext;
        renderPagerNumbers();

        if (shouldScroll) {
            pageFrameEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }
    }

    function visiblePageNumbers(current, total) {
        if (total <= 0) return [];
        if (total <= 7) {
            return Array.from({ length: total }, function (_, index) { return index + 1; });
        }
        const pages = new Set([1, total]);
        if (current <= 3) {
            [1, 2, 3, 4, 5].forEach(function (page) {
                if (page <= total) pages.add(page);
            });
        } else if (current >= total - 2) {
            [total - 4, total - 3, total - 2, total - 1, total].forEach(function (page) {
                if (page >= 1) pages.add(page);
            });
        } else {
            [current - 1, current, current + 1].forEach(function (page) { pages.add(page); });
        }
        const sorted = Array.from(pages).sort(function (left, right) { return left - right; });
        const result = [];
        sorted.forEach(function (page, index) {
            if (index > 0 && page - sorted[index - 1] > 1) result.push('ellipsis');
            result.push(page);
        });
        return result;
    }

    function renderPagerNumbers() {
        const total = coursePages.length;
        const current = currentPageIndex + 1;
        pagerPagesEl.replaceChildren();
        visiblePageNumbers(current, total).forEach(function (item) {
            if (item === 'ellipsis') {
                const dots = document.createElement('span');
                dots.className = 'course-pager-ellipsis';
                dots.textContent = '...';
                pagerPagesEl.appendChild(dots);
                return;
            }
            const button = document.createElement('button');
            button.type = 'button';
            button.className = 'course-pager-number' + (item === current ? ' is-active' : '');
            button.textContent = String(item);
            button.setAttribute('aria-label', 'Page ' + item + ' of ' + total);
            if (item === current) button.setAttribute('aria-current', 'page');
            button.addEventListener('click', function () { goToPage(item - 1); });
            pagerPagesEl.appendChild(button);
        });
    }

    function goToPage(index) {
        const nextIndex = Math.max(0, Math.min(coursePages.length - 1, index));
        if (nextIndex === currentPageIndex) return;
        currentPageIndex = nextIndex;
        renderCurrentPage(true);
    }

    function changePage(offset) {
        goToPage(currentPageIndex + offset);
    }

    async function loadCourse() {
        if (!courseId) {
            setError('Invalid course ID.');
            return;
        }
        try {
            const entitlements = await loadEntitlements();
            hasPaidPlan = hasEntitlement(entitlements, 'courses.premium');

            const params = new URLSearchParams();
            params.set('populate[content][on][coursecontent.text]', 'true');
            params.set('populate[content][on][coursecontent.quiz]', 'true');
            params.set('populate[content][on][coursecontent.pagebreaker]', 'true');
            params.set('populate[content][on][coursecontent.external-video]', 'true');
            params.set('populate[content][on][coursecontent.image][populate]', 'image_file');
            params.set('populate[content][on][coursecontent.video][populate][0]', 'video_file');
            params.set('populate[content][on][coursecontent.video][populate][1]', 'thumbnail');
            params.set('populate[content][on][coursecontent.attachments][populate]', 'files');
            params.set('populate[icon_image][populate]', 'formats');
            params.set('populate[coursecategory][populate]', '*');
            params.set('populate[pillar]', 'true');
            params.set('populate[localizations][fields][0]', 'title');
            params.set('populate[localizations][fields][1]', 'locale');
            params.set('locale', 'en');
            params.set('populate[localizations][filters][locale][$eq]', locale);

            params.set('filters[id][$eq]', String(courseId));

            const res = await fetch(strapiApiUrl + '/courses?' + params.toString(), {
                headers: authHeaders()
            });
            if (!res.ok) throw new Error('Failed to load course (' + res.status + ')');
            const body = await res.json();
            const course = Array.isArray(body?.data) ? body.data[0] : null;
            if (!course?.attributes) throw new Error('Course not found.');
            const backHref = getBackHref(course);
            backLinkEl.href = backHref;
            membershipCtaEl.href = '/membership?fromCourse=' + encodeURIComponent('/courses/' + courseId + window.location.search);
            titleEl.textContent = extractLocalizedTitle(course);

            if (isMembershipOnly(course) && !hasPaidPlan) {
                loadingEl.classList.add('d-none');
                pageFrameEl.classList.add('d-none');
                topImageEl.classList.add('d-none');
                lockEl.classList.remove('d-none');
                return;
            }

            const cover = course.attributes.icon_image?.data?.attributes;
            const coverUrl = cover?.formats?.large?.url || cover?.formats?.medium?.url || cover?.url || '';
            if (coverUrl) {
                topImageEl.src = fullAssetUrl(coverUrl);
                topImageEl.classList.remove('d-none');
            }

            courseContent = Array.isArray(course.attributes.content) ? course.attributes.content : [];
            coursePages = groupContentIntoPages(courseContent);
            currentPageIndex = 0;
            renderCurrentPage(false);
            loadingEl.classList.add('d-none');
            lockEl.classList.add('d-none');
            pageFrameEl.classList.remove('d-none');
        } catch (e) {
            console.error(e);
            setError('Could not load course details.');
        }
    }

    previousPageEl.addEventListener('click', () => changePage(-1));
    nextPageEl.addEventListener('click', () => changePage(1));
    window.addEventListener('beforeunload', stopSpeech);
    document.addEventListener('DOMContentLoaded', loadCourse);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
