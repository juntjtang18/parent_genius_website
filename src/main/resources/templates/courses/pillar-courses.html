<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="${pillar.name} + ' Courses'">Learning Pillar Courses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --gp-grad: linear-gradient(135deg, #3D91FD 0%, #6A84FF 48%, #8977FF 100%);
      --gp-cyan: #3EC8E8;
      --gp-ink: #111827;
      --gp-muted: #6B7280;
    }
    body{
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: var(--gp-ink);
      padding-top: 70px;
    }
    @media (min-width: 1200px){
      body{ padding-top: 96px; }
    }

    .pc-hero{
      background-image: var(--gp-grad);
      color: #fff;
      padding: 48px 0 72px;
    }
    .pc-hero-row{ min-height: 420px; }
    .pc-hero-kicker{
      color: #7DE8F2;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: .02em;
      margin: 0 0 12px;
    }
    .pc-hero-title{
      font-weight: 700;
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1.15;
      margin: 0 0 16px;
      max-width: 12ch;
    }
    .pc-hero-desc{
      font-size: 18px;
      line-height: 30px;
      color: rgba(255,255,255,.95);
      max-width: 34ch;
      margin: 0 0 28px;
    }
    .pc-hero-btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(90deg, #2ED3B7 0%, #1EC7E6 100%);
      color: #fff;
      border-radius: 9999px;
      padding: .75rem 1.8rem;
      font-weight: 600;
      font-size: 18px;
      text-decoration: none;
      box-shadow: 0 10px 20px rgba(23,162,184,.25);
    }
    .pc-hero-btn:hover{ color:#fff; filter: brightness(1.04); }
    .pc-hero-card{
      width: min(100%, 360px);
      aspect-ratio: 1;
      background: #fff;
      border-radius: 48px;
      box-shadow: 0 22px 48px rgba(15,23,42,.18);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .pc-ask{
      background: #111;
      padding: 22px 0 28px;
    }
    .pc-ask-bar{
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border-radius: 9999px;
      padding: 8px 8px 8px 22px;
      max-width: 920px;
      margin: 0 auto;
    }
    .pc-ask-bar input{
      flex: 1;
      border: 0;
      outline: none;
      font-size: 16px;
      color: var(--gp-ink);
      background: transparent;
      min-width: 0;
    }
    .pc-ask-bar input::placeholder{ color: #9CA3AF; }
    .pc-ask-btn{
      border: 0;
      border-radius: 9999px;
      background: var(--gp-cyan);
      color: #fff;
      font-weight: 600;
      padding: .55rem 1.3rem;
    }

    .pc-courses{
      padding: 56px 0 80px;
      background: #f4f6f8;
    }
    .pc-card{
      position: relative;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(15,23,42,.06);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .course-unpublished-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 2;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: rgba(33, 37, 41, 0.86);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.22);
      pointer-events: none;
    }
    .course-unpublished-badge i { font-size: 1rem; }
    .pc-card-image{
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #eef2f7;
    }
    .pc-card-placeholder{
      width: 100%;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9CA3AF;
      background: #eef2f7;
      font-size: 42px;
    }
    .pc-card-title{
      font-weight: 500;
      font-size: 20px;
      line-height: 28px;
      margin: 22px 20px 18px;
      color: var(--gp-ink);
    }
    .pc-card-btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gp-cyan);
      color: #fff;
      border-radius: 9999px;
      padding: .6rem 1.4rem;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      margin: 0 20px 28px;
      border: 0;
    }
    .pc-card-btn:hover{ color:#fff; filter: brightness(1.05); }
    .pc-card.is-unpublished .pc-card-image,
    .pc-card.is-unpublished .pc-card-placeholder{
      filter: grayscale(1);
      opacity: .45;
    }
    .pc-card.is-unpublished .pc-card-title{
      color: #9CA3AF;
    }
    .pc-card-btn.is-disabled{
      background: #D1D5DB;
      color: #6B7280;
      pointer-events: none;
      cursor: not-allowed;
      filter: none;
    }
    .pc-empty{
      text-align: center;
      color: var(--gp-muted);
      font-size: 18px;
      padding: 48px 0;
    }

    @media (max-width: 991.98px){
      .pc-hero{ padding-top: 32px; }
      .pc-hero-title{ max-width: none; }
    }
  </style>
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div th:if="${heroIndex == 1}" th:insert="~{fragments/pillar-course-hero-segment1 :: pillar-course-hero-segment1}"></div>
  <div th:if="${heroIndex == 2}" th:insert="~{fragments/pillar-course-hero-segment2 :: pillar-course-hero-segment2}"></div>
  <div th:if="${heroIndex == 3}" th:insert="~{fragments/pillar-course-hero-segment3 :: pillar-course-hero-segment3}"></div>
  <div th:if="${heroIndex == 4}" th:insert="~{fragments/pillar-course-hero-segment4 :: pillar-course-hero-segment4}"></div>
  <div th:if="${heroIndex == 5}" th:insert="~{fragments/pillar-course-hero-segment5 :: pillar-course-hero-segment5}"></div>
  <div th:if="${heroIndex == 6}" th:insert="~{fragments/pillar-course-hero-segment6 :: pillar-course-hero-segment6}"></div>

  <section class="pc-ask">
    <form class="pc-ask-bar" id="pcAskForm" action="#" onsubmit="return false;">
      <input id="pcAskInput" type="text" th:placeholder="#{pillar.ask.placeholder}" placeholder="Ask AI: 'What course should I take to learn...?'">
      <button class="pc-ask-btn" id="pcAskBtn" type="submit" th:text="#{pillar.ask.button}">Ask AI</button>
    </form>
  </section>

  <section class="pc-courses" id="courses">
    <div class="container-xxl">
      <p class="pc-empty" th:if="${#lists.isEmpty(courses)}" th:text="#{pillar.courses.empty}">No courses available for this pillar yet.</p>
      <div class="row g-4" th:if="${not #lists.isEmpty(courses)}">
        <div class="col-12 col-md-6 col-lg-4" th:each="course : ${courses}">
          <article class="pc-card" th:classappend="${course.published} ? '' : ' is-unpublished'">
            <span class="course-unpublished-badge" th:unless="${course.published}"
                  th:title="#{course-list.unpublished}" th:aria-label="#{course-list.unpublished}">
              <i class="fas fa-eye-slash" aria-hidden="true"></i>
            </span>
            <img th:if="${course.iconImageUrl != null}" class="pc-card-image"
                 th:src="${course.iconImageUrl}" th:alt="${course.title}">
            <div th:unless="${course.iconImageUrl != null}" class="pc-card-placeholder" aria-hidden="true">
              <i class="far fa-image"></i>
            </div>
            <h2 class="pc-card-title" th:text="${course.title}">Course title</h2>
            <a th:if="${course.published}" class="pc-card-btn"
               th:href="@{/courses/{id}(id=${course.id})}" th:text="#{pillar.courses.cta}">View the Course</a>
            <span th:unless="${course.published}" class="pc-card-btn is-disabled"
                  aria-disabled="true" th:text="#{pillar.courses.cta}">View the Course</span>
          </article>
        </div>
      </div>
    </div>
  </section>

  <div th:replace="~{fragments/chatbot :: chatbot}"></div>
  <div th:replace="~{fragments/footer :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('pcAskForm')?.addEventListener('submit', function () {
      const question = document.getElementById('pcAskInput')?.value || '';
      const icon = document.getElementById('chatbot-icon');
      const input = document.getElementById('chat-input');
      if (icon) icon.click();
      if (input && question) input.value = question;
    });
  </script>
</body>
</html>
