<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title th:text="#{suggested.courses.title}">Suggested for you</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    :root{
      --gp-grad: linear-gradient(135deg, #3D91FD 0%, #6A84FF 48%, #8977FF 100%);
      --gp-cyan: #3EC8E8;
      --gp-ink: #111827;
      --gp-muted: #6B7280;
    }
    body{
      font-family: "Poppins", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #f4f6f8;
      color: var(--gp-ink);
      padding-top: 70px;
    }
    @media (min-width: 1200px){
      body{ padding-top: 96px; }
    }

    .sc-hero{
      background-image: var(--gp-grad);
      color: #fff;
      padding: 56px 0 64px;
    }
    .sc-hero-kicker{
      color: #7DE8F2;
      font-weight: 600;
      font-size: 16px;
      letter-spacing: .02em;
      margin: 0 0 12px;
    }
    .sc-hero-title{
      font-weight: 700;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.15;
      margin: 0 0 16px;
      max-width: 16ch;
    }
    .sc-hero-desc{
      font-size: 18px;
      line-height: 30px;
      color: rgba(255,255,255,.95);
      max-width: 42ch;
      margin: 0;
    }

    .sc-courses{
      padding: 56px 0 80px;
      background: #f4f6f8;
    }
    .sc-card{
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(15,23,42,.06);
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }
    .sc-card-image{
      width: 100%;
      height: 210px;
      object-fit: cover;
      display: block;
      background: #eef2f7;
    }
    .sc-card-placeholder{
      width: 100%;
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #9CA3AF;
      background: #eef2f7;
      font-size: 42px;
    }
    .sc-card-title{
      font-weight: 500;
      font-size: 20px;
      line-height: 28px;
      margin: 22px 20px 18px;
      color: var(--gp-ink);
    }
    .sc-card-btn{
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--gp-cyan);
      color: #fff;
      border-radius: 9999px;
      padding: .6rem 1.4rem;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      margin: 0 20px 28px;
      border: 0;
    }
    .sc-card-btn:hover{ color:#fff; filter: brightness(1.05); }
    .sc-empty{
      text-align: center;
      color: var(--gp-muted);
      font-size: 18px;
      padding: 48px 0;
    }
  </style>
</head>
<body>
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <section class="sc-hero">
    <div class="container-xxl">
      <p class="sc-hero-kicker" th:text="#{suggested.courses.kicker}">AI Suggests</p>
      <h1 class="sc-hero-title" th:text="#{suggested.courses.title}">Suggested for you</h1>
      <p class="sc-hero-desc" th:text="#{suggested.courses.desc}">A short list of courses picked from the full catalog for your answers.</p>
    </div>
  </section>

  <section class="sc-courses" id="courses">
    <div class="container-xxl">
      <p class="sc-empty" th:if="${#lists.isEmpty(courses)}" th:text="#{suggested.courses.empty}">No courses available yet.</p>
      <div class="row g-4" th:if="${not #lists.isEmpty(courses)}">
        <div class="col-12 col-md-6 col-lg-4" th:each="course : ${courses}">
          <article class="sc-card">
            <img th:if="${course.iconImageUrl != null}" class="sc-card-image"
                 th:src="${course.iconImageUrl}" th:alt="${course.title}">
            <div th:unless="${course.iconImageUrl != null}" class="sc-card-placeholder" aria-hidden="true">
              <i class="far fa-image"></i>
            </div>
            <h2 class="sc-card-title" th:text="${course.title}">Course title</h2>
            <a class="sc-card-btn"
               th:href="@{/courses/{id}(id=${course.id}, fromPillar=${course.pillarId})}"
               th:text="#{pillar.courses.cta}">View the Course</a>
          </article>
        </div>
      </div>
    </div>
  </section>

  <div th:replace="~{fragments/chatbot :: chatbot}"></div>
  <div th:replace="~{fragments/footer :: footer}"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
