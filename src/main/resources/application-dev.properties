strapi.root.url=http://localhost:8080/
logging.level.org.springframework.security=DEBUG
logging.level.ca.parentgeniusai.website=DEBUG
server.port=${PORT:8081}

# Read templates/static from source so HTML edits show without a rebuild
spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.thymeleaf.cache=false
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/
spring.web.resources.cache.period=0
spring.messages.cache-duration=0
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.devtools.restart.poll-interval=2s
spring.devtools.restart.quiet-period=1s
